<!DOCTYPE html>
<!--
  OMS 主界面外壳 · 静态交互原型（登录后进入的页面）
  ------------------------------------------------------------------
  对应需求：M16 FR-PERM-002 菜单可见性控制
            M11 FR-COM-001 国际化、FR-COM-004 Logo 修改
            M02 FR-AUTH-001 登录后跳转至「该用户可访问的功能首页」、FR-AUTH-007 会话登出
            M01/M02/M04/M07/M08/M09/M10/M13/M14/M17 各设置子页面入口
  说明：单文件静态原型，纯 HTML + CSS + 原生 JS，无外部依赖，可离线双击打开。
  ------------------------------------------------------------------
  侧边栏信息架构（本页核心）：
    首页
    ── 上层业务模块注册区（扩展槽，OMS 自身不占用）──
    设置 ▾
        证书管理 / 许可证管理 / 系统备份 / 操作日志 / 运行日志 /
        告警列表 / 告警设置 / 告警统计 / 第三方接入 /
        资源组管理 / 用户组管理 / 账户管理 / 会话管理
  ------------------------------------------------------------------
  待确认：
    1. 任务中心（FR-COM-002）在信息架构中没有归属，见页面底部「原型说明」浮层。
    2. 设置下的 13 个子条目是否需要在侧边栏内再分组（如 安全合规 / 日志告警 / 接入与组织）。
-->
<html lang="zh-CN" data-lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>首页 · ModelEngine</title>
<style>
  /* ===================== 设计变量（与登录页保持一致） ===================== */
  :root{
    --brand-500:#2E7CF6;
    --brand-600:#1668DC;
    --brand-700:#0F55BC;
    --brand-soft:#EDF4FF;
    --brand-soft2:#F5F9FF;

    --text-1:#1B1F27;
    --text-2:#5A6472;
    --text-3:#8B95A5;
    --text-4:#AEB6C2;

    --line:#E4E9F2;
    --line-soft:#EEF2F8;
    --line-strong:#CBD5E5;

    --danger:#D9382F;
    --danger-bg:#FEF2F1;
    --success:#0E9F6E;
    --success-bg:#EBF9F3;

    --bg-page:#F6F8FC;
    --bg-sidebar:#FFFFFF;

    --radius-sm:8px;
    --radius:10px;
    --radius-lg:14px;

    --shadow-pop:0 12px 32px rgba(21,44,94,.14), 0 2px 8px rgba(21,44,94,.06);
    --shadow-focus:0 0 0 3px rgba(46,124,246,.14);

    --sidebar-w:260px;
    --topbar-h:60px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    color:var(--text-1);
    background:var(--bg-page);
    -webkit-font-smoothing:antialiased;
    /* 依次覆盖 macOS(PingFang) / Windows(雅黑) / Linux(Noto Sans CJK、思源、文泉驿)，
       避免在未安装中文字体的系统上回退成豆腐块 */
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",Arial,
                "Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC","WenQuanYi Micro Hei",sans-serif;
  }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; }

  /* ===================== 骨架 ===================== */
  .layout{
    display:grid;
    grid-template-columns:var(--sidebar-w) minmax(0,1fr);
    height:100vh;
    overflow:hidden;
  }

  /* ---------- 侧边栏 ---------- */
  .sidebar{
    display:flex;
    flex-direction:column;
    min-height:0;
    background:var(--bg-sidebar);
    border-right:1px solid var(--line);
  }
  .sidebar-head{
    flex:none;
    display:flex;
    align-items:center;
    height:var(--topbar-h);
    padding:0 18px;
    border-bottom:1px solid var(--line-soft);
  }
  .logo{ display:inline-flex; align-items:center; gap:9px; text-decoration:none; color:inherit; }
  .logo-mark{ display:inline-flex; width:28px; height:28px; }
  .logo-name{ font-size:16.5px; font-weight:650; letter-spacing:.2px; }

  .sidebar-nav{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:10px 10px 16px;
  }
  .sidebar-nav::-webkit-scrollbar{ width:8px; }
  .sidebar-nav::-webkit-scrollbar-thumb{ background:#DCE3EE; border-radius:4px; }
  .sidebar-nav::-webkit-scrollbar-thumb:hover{ background:#C6D0E0; }

  /* 菜单项 */
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    height:40px;
    padding:0 12px;
    border:0;
    border-radius:var(--radius);
    background:transparent;
    color:var(--text-2);
    font-size:14px;
    line-height:1;
    text-align:left;
    text-decoration:none;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item:hover{ background:var(--brand-soft2); color:var(--brand-700); }
  .nav-item:focus-visible{ outline:2px solid var(--brand-500); outline-offset:-2px; }
  .nav-item .nav-icon{ flex:none; width:17px; height:17px; color:var(--text-3); }
  .nav-item:hover .nav-icon{ color:var(--brand-500); }
  .nav-item .nav-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-item .nav-chevron{
    flex:none; width:14px; height:14px; color:var(--text-4);
    transition:transform .2s cubic-bezier(.22,.61,.36,1);
  }
  .nav-group.is-open .nav-chevron{ transform:rotate(180deg); }

  .nav-item.is-active{
    background:var(--brand-soft);
    color:var(--brand-700);
    font-weight:600;
  }
  .nav-item.is-active .nav-icon{ color:var(--brand-600); }

  /* 子菜单 */
  .nav-children{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .24s cubic-bezier(.22,.61,.36,1);
  }
  .nav-group.is-open .nav-children{ grid-template-rows:1fr; }
  .nav-children > div{ overflow:hidden; min-height:0; }
  .nav-child{
    position:relative;
    display:block;
    height:36px;
    padding:0 12px 0 39px;
    border-radius:var(--radius);
    color:var(--text-2);
    font-size:13.5px;
    line-height:36px;
    text-decoration:none;
    cursor:pointer;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .nav-child:hover{ background:var(--brand-soft2); color:var(--brand-700); }
  .nav-child:focus-visible{ outline:2px solid var(--brand-500); outline-offset:-2px; }
  /* 子菜单层级引导线 */
  .nav-child::before{
    content:"";
    position:absolute;
    left:20px; top:50%;
    width:7px; height:1px;
    background:#D9E1EE;
  }
  .nav-child.is-active{ background:var(--brand-soft); color:var(--brand-700); font-weight:600; }
  .nav-child.is-active::before{ background:var(--brand-500); }

  /* 设置子菜单内的分组 */
  .nav-group-label{
    padding:11px 12px 4px 26px;
    color:var(--text-4);
    font-size:11px; font-weight:600; letter-spacing:.4px;
    white-space:nowrap;
  }
  .nav-child.is-grouped{ padding-left:52px; }
  .nav-child.is-grouped::before{ left:33px; }

  /* 上层业务模块注册区（扩展槽） */
  .nav-slot{ display:flex; flex-direction:column; gap:2px; }
  .nav-slot:not(:empty){
    margin:8px 0;
    padding:8px 0;
    border-top:1px dashed var(--line-strong);
    border-bottom:1px dashed var(--line-strong);
  }
  .nav-slot-empty{
    margin:0;
    padding:12px;
    border-radius:var(--radius);
    background:#F8FAFD;
    color:var(--text-4);
    font-size:12px;
    line-height:1.6;
    text-align:center;
  }
  .nav-badge{
    flex:none;
    height:17px;
    padding:0 6px;
    border-radius:4px;
    background:#EEF1F6;
    color:var(--text-3);
    font-size:10.5px;
    line-height:17px;
  }

  .sidebar-foot{
    flex:none;
    padding:10px 14px;
    border-top:1px solid var(--line-soft);
    color:var(--text-4);
    font-size:11.5px;
    line-height:1.5;
  }

  /* ---------- 主区 ---------- */
  .main{ display:flex; flex-direction:column; min-width:0; min-height:0; }

  .topbar{
    flex:none;
    display:flex;
    align-items:center;
    gap:14px;
    height:var(--topbar-h);
    padding:0 20px;
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  .nav-toggle{
    display:none;
    align-items:center; justify-content:center;
    width:34px; height:34px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:#fff; color:var(--text-2);
    cursor:pointer;
  }
  .nav-toggle:hover{ border-color:var(--brand-500); color:var(--brand-600); }
  .nav-toggle svg{ width:17px; height:17px; }

  .crumb{ display:flex; align-items:center; gap:8px; min-width:0; font-size:13.5px; }
  .crumb-item{ color:var(--text-3); white-space:nowrap; }
  .crumb-item.is-current{ color:var(--text-1); font-weight:600; }
  .crumb-sep{ color:var(--text-4); }

  .topbar-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }

  /* 顶栏按钮（任务中心等） */
  .top-btn{
    display:inline-flex; align-items:center; gap:6px;
    height:32px; padding:0 12px;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    background:#fff; color:var(--text-2);
    font-size:13px; white-space:nowrap; cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .top-btn:hover{ border-color:var(--brand-500); color:var(--brand-600); background:var(--brand-soft2); }
  .top-btn:focus-visible{ outline:2px solid var(--brand-500); outline-offset:1px; }
  .top-btn svg{ width:15px; height:15px; flex:none; }
  .top-btn.is-active{ border-color:var(--brand-500); color:var(--brand-700); background:var(--brand-soft); }

  /* 语言切换 */
  .lang-switch{
    display:inline-flex; align-items:center; gap:2px;
    padding:3px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
  }
  .lang-btn{
    min-width:48px; height:26px; padding:0 11px;
    border:0; border-radius:999px; background:transparent;
    color:var(--text-2); font-size:12.5px; line-height:1; cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .lang-btn:hover{ color:var(--brand-600); }
  .lang-btn.is-active{ background:var(--brand-600); color:#fff; font-weight:600; }
  .lang-btn:focus-visible{ outline:2px solid var(--brand-500); outline-offset:2px; }

  /* 用户菜单 */
  .user-wrap{ position:relative; }
  .user-btn{
    display:inline-flex; align-items:center; gap:8px;
    height:36px; padding:0 10px 0 6px;
    border:1px solid transparent; border-radius:999px;
    background:transparent; cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .user-btn:hover{ background:var(--brand-soft2); border-color:var(--line); }
  .user-btn:focus-visible{ outline:2px solid var(--brand-500); outline-offset:2px; }
  .avatar{
    flex:none; display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; border-radius:50%;
    background:linear-gradient(160deg,#4A93FF,#1668DC);
    color:#fff; font-size:12px; font-weight:650;
  }
  .user-name{ font-size:13.5px; color:var(--text-1); max-width:160px; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap; }
  .user-btn svg{ width:14px; height:14px; color:var(--text-3); }

  .user-menu{
    position:absolute; right:0; top:calc(100% + 8px);
    width:228px; padding:6px;
    border:1px solid var(--line); border-radius:12px;
    background:#fff; box-shadow:var(--shadow-pop);
    z-index:30;
    animation:popIn .16s ease both;
  }
  @keyframes popIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
  .user-menu-head{ padding:10px 10px 12px; border-bottom:1px solid var(--line-soft); }
  .user-menu-name{ font-size:13.5px; font-weight:600; }
  .user-menu-role{ margin-top:3px; font-size:12px; color:var(--text-3); }
  .user-menu-item{
    display:flex; align-items:center; gap:9px;
    width:100%; height:36px; padding:0 10px;
    border:0; border-radius:var(--radius-sm); background:transparent;
    color:var(--text-2); font-size:13.5px; text-align:left; text-decoration:none; cursor:pointer;
  }
  .user-menu-item:hover{ background:var(--brand-soft2); color:var(--brand-700); }
  .user-menu-item svg{ width:15px; height:15px; }
  .user-menu-item.is-danger:hover{ background:var(--danger-bg); color:var(--danger); }

  /* ---------- 内容区 ---------- */
  .content{
    flex:1; min-height:0; overflow-y:auto;
    padding:22px 24px 32px;
  }
  .page-head{ margin-bottom:18px; }
  .page-title{ margin:0; font-size:21px; font-weight:650; letter-spacing:.2px; }
  .page-sub{ margin:7px 0 0; font-size:13px; color:var(--text-3); line-height:1.6; }

  .panel{
    padding:22px 24px;
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    background:#fff;
  }

  /* 首页欢迎条 */
  .welcome{
    display:flex; align-items:center; gap:18px;
    padding:24px 26px;
    border:1px solid #DDE8FA;
    border-radius:var(--radius-lg);
    background:
      radial-gradient(520px 200px at 92% 0%, #EAF3FF 0%, rgba(234,243,255,0) 68%),
      linear-gradient(180deg,#F8FBFF 0%,#FFFFFF 100%);
  }
  .welcome-avatar{
    flex:none; display:inline-flex; align-items:center; justify-content:center;
    width:52px; height:52px; border-radius:16px;
    background:linear-gradient(160deg,#4A93FF,#1668DC);
    color:#fff; font-size:19px; font-weight:650;
  }
  .welcome-title{ margin:0; font-size:19px; font-weight:650; }
  .welcome-desc{ margin:6px 0 0; font-size:13px; color:var(--text-2); line-height:1.6; }

  /* 待设计占位 */
  .placeholder{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
    min-height:260px;
    margin-top:16px;
    padding:32px;
    border:1px dashed var(--line-strong);
    border-radius:var(--radius-lg);
    background:
      radial-gradient(rgba(22,104,220,.09) 1px, transparent 1.2px) 0 0/18px 18px,
      #FCFDFF;
    text-align:center;
  }
  .placeholder-icon{ width:30px; height:30px; color:#C3CEDF; }
  .placeholder-title{ margin:2px 0 0; font-size:14px; font-weight:600; color:var(--text-2); }
  .placeholder-desc{ margin:0; font-size:12.5px; color:var(--text-3); line-height:1.6; max-width:480px; }

  .content.is-centered{ display:flex; align-items:center; justify-content:center; }

  /* 无可用功能（FR-PERM-002） */
  .no-permission{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center;
  }
  .no-permission-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:64px; height:64px; border-radius:20px;
    background:#F1F5FB; color:#9DAEC6;
  }
  .no-permission-icon svg{ width:30px; height:30px; }
  .no-permission-title{ margin:6px 0 0; font-size:16px; font-weight:650; }
  .no-permission-desc{ margin:0; font-size:13px; color:var(--text-3); line-height:1.7; max-width:460px; }

  /* ===================== 首次登录用户协议弹窗（FR-AUTH-008） =====================
     展示时机：首次登录（改密后重新登录）进入首页时；未确认前不得使用任何功能 */
  .agr-mask{
    position:fixed; inset:0; z-index:75;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
    background:rgba(17,24,39,.52);
    animation:fadeIn .18s ease both;
  }
  .agr{
    display:flex; flex-direction:column;
    width:660px; max-width:100%; max-height:100%;
    border-radius:var(--radius-lg);
    background:#fff;
    box-shadow:0 28px 70px rgba(12,20,40,.3);
    animation:popIn .22s cubic-bezier(.22,.61,.36,1) both;
  }
  .agr-head{ flex:none; padding:22px 26px 16px; border-bottom:1px solid var(--line-soft); }
  .agr-head h2{ margin:0; font-size:17px; font-weight:650; }
  .agr-head p{ margin:7px 0 0; font-size:12.5px; color:var(--text-3); line-height:1.6; }
  .agr-body{
    flex:1; min-height:0; overflow-y:auto;
    padding:18px 26px 20px;
    font-size:13px; line-height:1.9; color:var(--text-2);
  }
  .agr-body::-webkit-scrollbar{ width:8px; }
  .agr-body::-webkit-scrollbar-thumb{ background:#DCE3EE; border-radius:4px; }
  .agr-body h3{ margin:16px 0 6px; font-size:13.5px; font-weight:650; color:var(--text-1); }
  .agr-body h3:first-child{ margin-top:0; }
  .agr-body p{ margin:0 0 6px; }
  .agr-foot{
    flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:14px 26px 18px; border-top:1px solid var(--line-soft); background:#FCFDFF;
    border-radius:0 0 var(--radius-lg) var(--radius-lg);
  }
  .agr-hint{ flex:1 1 100%; font-size:12px; color:var(--text-3); line-height:1.6; }
  .agr-hint b{ color:var(--brand-600); font-weight:600; }
  .agr-btn{
    height:38px; padding:0 20px;
    border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--text-1); font-size:13.5px;
    white-space:nowrap; cursor:pointer;
    transition:border-color .15s ease, color .15s ease, filter .15s ease;
  }
  .agr-btn:hover{ border-color:var(--brand-500); color:var(--brand-600); }
  .agr-btn:focus-visible{ outline:2px solid var(--brand-500); outline-offset:1px; }
  .agr-btn-primary{
    margin-left:auto; border-color:transparent;
    background:linear-gradient(180deg,var(--brand-500),var(--brand-600));
    color:#fff; font-weight:600; box-shadow:0 4px 12px rgba(22,104,220,.22);
  }
  .agr-btn-primary:hover{ color:#fff; filter:brightness(1.06); }
  .agr-btn:disabled{
    cursor:not-allowed; background:#E9EEF6; border-color:#E9EEF6; color:#9AA6B8;
    box-shadow:none; filter:none;
  }
  .agr-btn:disabled:hover{ border-color:#E9EEF6; color:#9AA6B8; }

  /* ===================== 原型说明浮层（仅原型使用） ===================== */
  .proto{ position:fixed; right:18px; bottom:18px; z-index:60; font-size:12.5px; }
  .proto-toggle{
    display:inline-flex; align-items:center; gap:6px;
    height:32px; padding:0 12px;
    border:1px solid rgba(255,255,255,.14); border-radius:999px;
    background:rgba(27,31,39,.86); color:#fff; cursor:pointer; backdrop-filter:blur(6px);
  }
  .proto-toggle:hover{ background:rgba(27,31,39,.95); }
  .proto-panel{
    width:290px; margin-bottom:8px; padding:14px;
    border-radius:12px; background:rgba(27,31,39,.95); color:#E7ECF5;
    box-shadow:0 12px 32px rgba(12,20,40,.3); backdrop-filter:blur(8px);
  }
  .proto-panel h4{ margin:0 0 10px; font-size:13px; color:#fff; }
  .proto-panel p{ margin:0 0 10px; line-height:1.65; color:#B9C4D6; }
  .proto-field{ margin:0 0 10px; }
  .proto-label{ display:block; margin-bottom:6px; color:#DCE4F0; }
  .proto-seg{ display:flex; gap:4px; }
  .proto-seg button{
    flex:1; height:28px;
    border:1px solid rgba(255,255,255,.18); border-radius:7px;
    background:transparent; color:#DCE4F0; font-size:12px; cursor:pointer;
  }
  .proto-seg button:hover{ background:rgba(255,255,255,.08); }
  .proto-seg button.is-on{ background:#2E7CF6; border-color:#2E7CF6; color:#fff; font-weight:600; }
  .proto-row{ display:flex; align-items:center; gap:8px; margin:0 0 10px;
              color:#DCE4F0; cursor:pointer; }
  .proto-row input{ accent-color:#2E7CF6; }
  .proto-note{ margin:0; color:#8E9BB0; font-size:11.5px; line-height:1.65; }

  /* ===================== 页面头 / 工具栏 ===================== */
  .page-head-row{
    display:flex; align-items:flex-start; gap:16px;
    margin-bottom:16px;
  }
  .page-head-row .page-head{ margin:0; flex:1; min-width:0; }
  .page-actions{ display:flex; align-items:center; gap:10px; flex:none; padding-top:2px; }

  /* 按钮 */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:34px; padding:0 14px;
    border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--text-1);
    font-size:13.5px; line-height:1; white-space:nowrap; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease, filter .15s ease;
  }
  .btn:hover{ border-color:var(--brand-500); color:var(--brand-600); }
  .btn-sm{ height:30px; padding:0 12px; font-size:13px; }
  .btn:focus-visible{ outline:2px solid var(--brand-500); outline-offset:1px; }
  .btn svg{ width:15px; height:15px; flex:none; }
  .btn-primary{
    border-color:transparent;
    background:linear-gradient(180deg,var(--brand-500),var(--brand-600));
    color:#fff; font-weight:600;
    box-shadow:0 4px 12px rgba(22,104,220,.2);
  }
  .btn-primary:hover{ color:#fff; filter:brightness(1.06); }
  .btn-danger{ border-color:#F3C9C6; color:var(--danger); }
  .btn-danger:hover{ border-color:var(--danger); background:var(--danger-bg); color:var(--danger); }
  .btn:disabled{ cursor:not-allowed; color:var(--text-4); border-color:var(--line);
                 background:#F7F9FC; box-shadow:none; }
  .btn:disabled:hover{ border-color:var(--line); color:var(--text-4); }

  /* 筛选栏 */
  .filter-bar{
    display:flex; align-items:center; flex-wrap:wrap; gap:10px;
    margin-bottom:14px; padding:12px 14px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:#fff;
  }
  .filter-item{ display:flex; align-items:center; gap:7px; }
  .filter-item > span{ font-size:13px; color:var(--text-2); white-space:nowrap; }
  .input-sm, select.input-sm{
    height:32px; padding:0 10px;
    border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--text-1); font-size:13px;
    font-family:inherit;
  }
  .input-sm::placeholder{ color:var(--text-4); }
  .input-sm:focus, select.input-sm:focus{
    outline:none; border-color:var(--brand-500); box-shadow:var(--shadow-focus);
  }
  .input-search{ width:200px; }
  select.input-sm{ padding-right:26px; cursor:pointer; }
  .filter-bar select.input-sm{ width:104px; }
  .filter-spacer{ flex:1; }
  .btn .batch-count{ font-weight:400; }

  /* ===================== 表格 ===================== */
  .table-card{
    border:1px solid var(--line); border-radius:var(--radius-lg);
    background:#fff; overflow:hidden;
  }
  .table-scroll{ overflow-x:auto; }
  table.data{
    width:100%; border-collapse:collapse; font-size:13px;
    min-width:1080px;
  }
  table.data th{
    padding:11px 12px;
    background:#FAFBFD;
    border-bottom:1px solid var(--line);
    color:var(--text-2); font-weight:600; font-size:12.5px;
    text-align:left; white-space:nowrap;
  }
  table.data td{
    padding:12px 12px;
    border-bottom:1px solid var(--line-soft);
    color:var(--text-1); vertical-align:middle;
  }
  table.data tbody tr:last-child td{ border-bottom:0; }
  table.data tbody tr:hover{ background:#FAFCFF; }
  .col-remark{ color:var(--text-2); }
  .remark-text{ display:inline-block; max-width:140px; vertical-align:middle;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .col-email{ color:var(--text-2); white-space:nowrap; }
  .col-group{ white-space:nowrap; }
  .cell-empty{ color:var(--text-4); }
  table.data th.col-check, table.data td.col-check{
    width:44px; padding-right:2px; padding-left:16px;
  }
  .row-check, .check-all{
    width:15px; height:15px; margin:0;
    accent-color:var(--brand-600);
    cursor:pointer;
  }
  .row-check:disabled, .check-all:disabled{
    cursor:not-allowed; accent-color:#C3CCDA;
  }
  .cell-name{ display:flex; align-items:center; gap:7px; }
  .cell-name b{ font-weight:600; }

  /* 徽标 */
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    height:22px; padding:0 9px;
    border-radius:999px; font-size:12px; line-height:1; white-space:nowrap;
  }
  .badge::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
  .badge-active{ background:var(--success-bg); color:#0B7F58; }
  .badge-locked{ background:var(--danger-bg); color:#B72B23; }
  .badge-builtin{ background:#EEF2F8; color:var(--text-2); font-size:11px; height:19px; padding:0 7px; }
  .badge-builtin::before{ display:none; }
  .badge-plain{ background:#F2F5FA; color:var(--text-2); }
  .badge-plain::before{ background:var(--text-4); }
  .badge-warn{ background:#FFF4E5; color:#B76E00; }

  .online{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; }
  .online::before{ content:""; width:7px; height:7px; border-radius:50%; }
  .online.is-on{ color:#0B7F58; }
  .online.is-on::before{ background:#12B886; box-shadow:0 0 0 3px rgba(18,184,134,.16); }
  .online.is-off{ color:var(--text-3); }
  .online.is-off::before{ background:#C3CCDA; }

  .row-actions{ display:flex; align-items:center; gap:2px; white-space:nowrap; }
  .link-btn{
    height:26px; padding:0 6px;
    border:0; border-radius:6px; background:transparent;
    color:var(--brand-600); font-size:12.5px; cursor:pointer;
    transition:background .15s ease;
  }
  .link-btn:hover{ background:var(--brand-soft); }
  .link-btn:focus-visible{ outline:2px solid var(--brand-500); outline-offset:1px; }
  .link-btn.is-danger{ color:var(--danger); }
  .link-btn.is-danger:hover{ background:var(--danger-bg); }
  .link-btn:disabled{ color:var(--text-4); cursor:not-allowed; background:transparent; }
  .link-btn:disabled:hover{ background:transparent; }

  /* 运行日志（M09） */
  .seg{ display:inline-flex; padding:3px; border:1px solid var(--line); border-radius:999px; background:#fff; }
  .seg-btn{
    min-width:104px; height:30px; padding:0 14px;
    border:0; border-radius:999px; background:transparent;
    color:var(--text-2); font-size:13px; line-height:1; cursor:pointer;
    transition:background .16s ease, color .16s ease;
  }
  .seg-btn:hover{ color:var(--brand-600); }
  .seg-btn.is-on{ background:var(--brand-600); color:#fff; font-weight:600; }
  .seg-btn:focus-visible{ outline:2px solid var(--brand-500); outline-offset:2px; }
  .f-inline{ display:flex; align-items:center; gap:8px; }
  .f-inline .f-num{ width:110px; flex:none; }   /* 需覆盖 .f-input 的 width:100% */
  .f-unit{ font-size:12.5px; color:var(--text-3); white-space:nowrap; }
  .col-file{ display:flex; align-items:center; gap:8px; }
  .col-file svg{ width:15px; height:15px; flex:none; color:var(--brand-600); }
  .col-range{ white-space:nowrap; font-family:Menlo,Consolas,"Courier New",monospace; font-size:12.5px;
              color:var(--text-2); }
  .badge-running{ background:#EAF2FF; color:#1D5FBF; }
  .badge-running::before{ background:#2E7CF6; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }

  .col-ip{ font-family:Menlo,Consolas,"Courier New",monospace; font-size:12.5px; color:var(--text-2);
           white-space:nowrap; }
  .col-dur{ white-space:nowrap; color:var(--text-2); }

  /* ===================== 证书管理（M13） ===================== */
  .cert-name{
    height:auto; padding:0; font-size:13px; font-weight:600; color:var(--brand-600);
  }
  .cert-name:hover{ background:transparent; text-decoration:underline; }
  /* 描述卡片：证书详情抽屉 / 系统备份页共用（标题 + 若干「字段-取值」行） */
  .des-card{
    margin-bottom:16px; border:1px solid var(--line); border-radius:var(--radius-lg);
    background:#fff; overflow:hidden;
  }
  .des-head{
    display:flex; align-items:center; gap:8px;
    padding:11px 14px; background:#FAFBFD; border-bottom:1px solid var(--line);
    font-size:13px; font-weight:650; color:var(--text-1);
  }
  .des-head svg{ width:15px; height:15px; color:var(--brand-600); flex:none; }
  .des-head .des-head-extra{ margin-left:auto; font-size:12px; font-weight:400; color:var(--text-3); }
  .des-row{
    display:flex; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line-soft);
    font-size:13px;
  }
  .des-row:last-child{ border-bottom:0; }
  .des-row dt{ flex:none; width:92px; color:var(--text-3); }
  .des-row dd{ margin:0; flex:1; min-width:0; color:var(--text-1); line-height:1.6;
               word-break:break-all; }
  .des-mono{ font-family:Menlo,Consolas,"Courier New",monospace; font-size:12.5px; color:var(--text-2); }
  .des-card.labels-wide .des-row dt{ width:138px; }   /* 系统备份页的长标签 */
  /* 上传栏：按钮 + 已选文件名 */
  .up-row{ display:flex; align-items:center; gap:10px; }
  .up-name{
    flex:1; min-width:0; font-size:12.5px; color:var(--text-4);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .up-name.is-set{ color:var(--text-1); }
  /* 开关（过期预警 / 高级） */
  .switch{
    display:inline-flex; align-items:center; gap:9px;
    padding:0; border:0; background:transparent; cursor:pointer;
  }
  .switch-track{
    position:relative; flex:none; width:40px; height:22px; border-radius:999px;
    background:#C3CCDA; transition:background .16s ease;
  }
  .switch-knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(12,20,40,.28); transition:transform .16s ease;
  }
  .switch.is-on .switch-track{ background:var(--brand-600); }
  .switch.is-on .switch-knob{ transform:translateX(18px); }
  .switch-label{ font-size:13px; color:var(--text-2); }
  .switch.is-on .switch-label{ color:var(--text-1); font-weight:600; }
  .switch:focus-visible{ outline:2px solid var(--brand-500); outline-offset:2px; border-radius:999px; }
  .f-input:disabled{ background:#F5F7FB; color:var(--text-4); border-color:var(--line);
                     cursor:not-allowed; }
  .f-readonly{
    display:flex; align-items:center; min-height:36px; padding:8px 12px;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    background:#F7F9FC; color:var(--text-2); font-size:13px; line-height:1.6;
    word-break:break-all;
  }
  .f-field.is-disabled .f-label, .f-field.is-disabled .f-hint{ color:var(--text-4); }
  /* 生成CSR 的高级字段：两列排布，避免抽屉内出现长滚动 */
  .f-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }

  /* ===================== 资源组 / 用户组（M04） ===================== */
  .cell-tags{
    display:inline-block; max-width:190px; vertical-align:middle;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .group-desc{ color:var(--text-2); }
  .remark-text.cell-desc{ max-width:320px; }   /* 用途说明列放宽，避免过早截断 */
  /* 第三方接入页：SNMP 引擎ID 列（长十六进制串，超长省略） */
  .remark-text.cell-engine{ max-width:196px; font-family:Menlo,Consolas,"Courier New",monospace;
                            font-size:12px; }
  /* 抽屉里的测试结果行（SFTP 连通性测试） */
  .f-hint.is-ok-msg{ color:#15803D; }
  .f-hint.is-bad-msg{ color:var(--danger); }

  /* ===================== 告警统计（M17） ===================== */
  .rank-list{ padding:4px 0; }
  .rank-row{ display:flex; align-items:center; gap:10px; padding:8px 16px; }
  .rank-row:hover{ background:#FAFCFF; }
  .rank-no{
    flex:none; width:20px; text-align:right;
    font-size:12.5px; color:var(--text-3); font-variant-numeric:tabular-nums;
  }
  .rank-name{
    flex:none; width:250px; font-size:13px; color:var(--text-1);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rank-bar{
    flex:1; min-width:60px; height:10px; border-radius:999px;
    background:#EFF3F9; overflow:hidden;
  }
  .rank-bar i{ display:block; height:100%; border-radius:999px; background:var(--brand-500); }
  .rank-bar i.is-critical{ background:#E5484D; }
  .rank-bar i.is-major{ background:#E8A33D; }
  .rank-bar i.is-normal{ background:#3B8CFF; }
  .rank-bar i.is-hint{ background:#B6C4DA; }
  .rank-count{
    flex:none; width:56px; text-align:right;
    font-size:13px; font-weight:600; color:var(--text-1);
    font-variant-numeric:tabular-nums;
  }
  .col-count{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }

  /* ===================== 告警列表（M17） ===================== */
  .tabs{ display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .tab{
    position:relative; height:38px; padding:0 14px;
    border:0; background:transparent; color:var(--text-2); font-size:13.5px; cursor:pointer;
  }
  .tab:hover{ color:var(--brand-600); }
  .tab.is-on{ color:var(--brand-600); font-weight:600; }
  .tab.is-on::after{
    content:""; position:absolute; left:10px; right:10px; bottom:-1px;
    height:2px; border-radius:2px; background:var(--brand-600);
  }
  .tab-count{ font-weight:400; color:var(--text-3); }
  table.data th.th-sort{ cursor:pointer; user-select:none; }
  table.data th.th-sort:hover{ color:var(--brand-600); }
  table.data th.th-sort.is-sorted{ color:var(--brand-600); }
  table.data th.th-sort::after{
    content:"⇅"; margin-left:5px; font-size:9px; color:var(--text-4);
  }
  table.data th.th-sort.is-sorted::after{ color:var(--brand-600); }
  table.data th.th-sort.is-sorted.asc::after{ content:"▲"; }
  table.data th.th-sort.is-sorted.desc::after{ content:"▼"; }
  .filter-bar .alm-search{ width:150px; }
  .filter-bar select.alm-ip{ width:120px; font-family:Menlo,Consolas,"Courier New",monospace;
                             font-size:12.5px; }
  .badge-lv-hint{ background:#F2F5FA; color:var(--text-2); }
  .badge-lv-normal{ background:#EAF2FF; color:#1D5FBF; }
  .badge-lv-major{ background:#FFF4E5; color:#B76E00; }
  .badge-lv-critical{ background:var(--danger-bg); color:#B72B23; }
  .radio-item{
    display:flex; align-items:center; gap:9px;
    padding:10px 12px; margin-bottom:8px;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    font-size:13px; color:var(--text-1); cursor:pointer;
  }
  .radio-item:last-child{ margin-bottom:0; }
  .radio-item:hover{ border-color:var(--brand-500); background:var(--brand-soft2); }
  .radio-item.is-on{ border-color:var(--brand-500); background:var(--brand-soft2); font-weight:600; }
  .radio-item input{
    flex:none; width:15px; height:15px; margin:0; accent-color:var(--brand-600); cursor:pointer;
  }
  .f-textarea{ height:auto; min-height:78px; padding:9px 12px; resize:vertical; line-height:1.6; }
  .f-inline-gap{ margin-top:10px; }

  /* 抽屉内分区标题（基本信息 / 屏蔽规则） */
  .f-section{
    margin:22px 0 14px; padding-bottom:8px;
    border-bottom:1px solid var(--line);
    font-size:13px; font-weight:650; color:var(--text-1);
  }
  .f-section:first-child{ margin-top:0; }
  /* 自定义范围：添加按钮 + 已添加表格 */
  .scope-tools{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .scope-count{ font-size:12.5px; color:var(--text-3); }
  .scope-empty{
    padding:14px 12px; border:1px dashed var(--line-strong); border-radius:var(--radius-sm);
    color:var(--text-3); font-size:12.5px; text-align:center;
  }

  /* ===================== 系统备份（M10） ===================== */
  .comp-row{
    display:flex; gap:14px; padding:12px 14px; border-bottom:1px solid var(--line-soft);
    font-size:13px;
  }
  .comp-row:last-child{ border-bottom:0; }
  .comp-name{
    flex:none; width:150px; display:flex; align-items:center; gap:7px;
    font-weight:600; color:var(--text-1);
  }
  .comp-name svg{ width:15px; height:15px; color:var(--brand-600); flex:none; }
  .comp-items{ display:flex; flex-wrap:wrap; gap:6px; min-width:0; }
  .comp-chip{
    display:inline-flex; align-items:center; height:24px; padding:0 10px;
    border-radius:6px; background:#F2F5FA; color:var(--text-2); font-size:12.5px;
  }
  /* 多选条目（备份组件） */
  .pick-item{
    display:flex; gap:10px; align-items:flex-start;
    padding:10px 12px; margin-bottom:8px;
    border:1px solid var(--line); border-radius:var(--radius-sm); cursor:pointer;
  }
  .pick-item:last-child{ margin-bottom:0; }
  .pick-item:hover{ border-color:var(--brand-500); background:var(--brand-soft2); }
  .pick-item.is-locked{ cursor:default; background:#F7F9FC; }
  .pick-item.is-locked:hover{ border-color:var(--line); background:#F7F9FC; }
  .pick-check{
    flex:none; width:15px; height:15px; margin:2px 0 0;
    accent-color:var(--brand-600); cursor:pointer;
  }
  .pick-item.is-locked .pick-check{ cursor:not-allowed; }
  .pick-body{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .pick-name{
    display:flex; align-items:center; gap:7px;
    font-size:13px; font-weight:600; color:var(--text-1);
  }
  .pick-desc{ font-size:12px; color:var(--text-3); line-height:1.5; }
  /* 星期多选 */
  .wd-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .wd-item{
    display:flex; align-items:center; gap:7px; height:32px; padding:0 10px;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    font-size:12.5px; color:var(--text-2); cursor:pointer;
  }
  .wd-item:hover{ border-color:var(--brand-500); color:var(--brand-600); }
  .wd-item.is-on{
    border-color:var(--brand-500); background:var(--brand-soft2);
    color:var(--text-1); font-weight:600;
  }
  .wd-item input{
    flex:none; width:14px; height:14px; margin:0; accent-color:var(--brand-600); cursor:pointer;
  }
  .badge-ok{ background:var(--success-bg); color:#0B7F58; }
  .badge-fail{ background:var(--danger-bg); color:#B72B23; }
  .pager{ display:flex; align-items:center; gap:6px; }
  .pager button{
    height:28px; padding:0 10px;
    border:1px solid var(--line-strong); border-radius:6px;
    background:#fff; color:var(--text-2); font-size:12.5px; cursor:pointer;
  }
  .pager button:hover:not(:disabled){ border-color:var(--brand-500); color:var(--brand-600); }
  .pager button:disabled{ cursor:not-allowed; color:var(--text-4); border-color:var(--line); background:#F7F9FC; }
  .pager .pager-info{ font-size:12.5px; color:var(--text-3); }
  .input-date{ width:138px; }
  /* 操作日志筛选栏控件较密，收窄以保持单行 */
  .filter-bar .log-search, .filter-bar .stat-search{ width:168px; }
  .filter-bar .log-date{ width:132px; }
  .filter-sep{ color:var(--text-4); }

  .table-foot{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px;
    border-top:1px solid var(--line);
    color:var(--text-3); font-size:12.5px;
  }

  /* ===================== 安全策略（M15） ===================== */
  .pol-card{
    margin-bottom:16px;
    border:1px solid var(--line); border-radius:var(--radius-lg);
    background:#fff; overflow:hidden;
  }
  .pol-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 20px;
    border-bottom:1px solid var(--line-soft);
    background:#FAFBFD;
  }
  .pol-head h2{ margin:0; font-size:14.5px; font-weight:650; }
  .pol-head .pol-count{ color:var(--text-3); font-size:12px; }
  .pol-head svg{ width:16px; height:16px; color:var(--brand-600); flex:none; }
  .pol-body{ padding:6px 20px 10px; }
  .pol-row{
    display:flex; align-items:flex-start; gap:20px;
    padding:14px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .pol-row:last-child{ border-bottom:0; }
  .pol-label{ flex:1; min-width:0; }
  .pol-name{ display:block; font-size:13.5px; color:var(--text-1); line-height:1.6; }
  .pol-meta{ display:block; margin-top:3px; font-size:12px; color:var(--text-3); line-height:1.55; }
  .pol-control{ flex:none; display:flex; align-items:center; gap:8px; padding-top:1px; }
  .pol-input{
    width:96px; height:34px; padding:0 10px;
    border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--text-1); font-size:13.5px; font-family:inherit;
    text-align:left;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .pol-input:focus{ outline:none; border-color:var(--brand-500); box-shadow:var(--shadow-focus); }
  .pol-input:disabled{ background:#F5F7FB; color:var(--text-4); border-color:var(--line); }
  .pol-unit{ min-width:34px; font-size:12.5px; color:var(--text-3); }
  .pol-row.has-error .pol-input{ border-color:var(--danger); }
  .pol-row.has-error .pol-meta{ color:var(--danger); }
  .pol-seg{ display:inline-flex; padding:3px; border:1px solid var(--line); border-radius:999px; background:#fff; }
  .pol-seg-btn{
    min-width:46px; height:26px; padding:0 12px;
    border:0; border-radius:999px; background:transparent;
    color:var(--text-2); font-size:12.5px; line-height:1; cursor:pointer;
  }
  .pol-seg-btn:hover{ color:var(--brand-600); }
  .pol-seg-btn.is-on{ background:var(--brand-600); color:#fff; font-weight:600; }
  .pol-seg-btn:focus-visible{ outline:2px solid var(--brand-500); outline-offset:2px; }
  .pol-row.is-disabled .pol-name, .pol-row.is-disabled .pol-meta{ color:var(--text-4); }
  .pol-actions, .action-bar{
    display:flex; align-items:center; gap:10px;
    padding:16px 20px; margin-bottom:8px;
    border:1px solid var(--line); border-radius:var(--radius-lg);
    background:#fff;
  }
  .pol-actions .pol-note, .action-bar .bar-note{
    flex:1; font-size:12.5px; color:var(--text-3); line-height:1.6;
  }

  /* ===================== 右侧抽屉 ===================== */
  .drawer-mask{
    position:fixed; inset:0; z-index:60;
    background:rgba(17,24,39,.38);
    animation:fadeIn .18s ease both;
  }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; z-index:61;
    display:flex; flex-direction:column;
    width:460px; max-width:100vw;
    background:#fff;
    box-shadow:-12px 0 40px rgba(12,20,40,.16);
    animation:slideIn .24s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes slideIn{ from{ transform:translateX(24px); opacity:.6 } to{ transform:none; opacity:1 } }
  .drawer.is-wide{ width:580px; }
  .drawer-head{
    flex:none; display:flex; align-items:flex-start; gap:12px;
    padding:18px 22px 14px; border-bottom:1px solid var(--line-soft);
  }
  .drawer-head h2{ margin:0; font-size:16.5px; font-weight:650; }
  .drawer-head p{ margin:6px 0 0; font-size:12.5px; color:var(--text-3); line-height:1.6; }
  .drawer-close{
    flex:none; margin-left:auto;
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border:0; border-radius:8px;
    background:transparent; color:var(--text-3); cursor:pointer;
  }
  .drawer-close:hover{ background:#F2F5FA; color:var(--text-1); }
  .drawer-close svg{ width:16px; height:16px; }
  .drawer-body{ flex:1; min-height:0; overflow-y:auto; padding:20px 22px; }
  .drawer-foot{
    flex:none; display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end;
    gap:10px;
    padding:14px 22px; border-top:1px solid var(--line-soft);
    background:#FCFDFF;
  }
  .drawer-foot .foot-note{ flex:1 1 100%; margin:0; color:var(--text-3); font-size:12px; line-height:1.6; }
  .drawer-foot .foot-note:empty{ display:none; }
  .drawer-foot .btn{ flex:none; }

  /* 表单字段（与登录页一致的语言） */
  .f-field{ margin-bottom:18px; }
  .f-label{
    display:block; margin-bottom:7px;
    font-size:13px; font-weight:550; color:var(--text-2);
  }
  .f-label .req{ color:var(--danger); margin-left:2px; }
  .f-input{
    width:100%; height:38px; padding:0 12px;
    border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--text-1); font-size:13.5px; font-family:inherit;
    transition:border-color .16s ease, box-shadow .16s ease;
  }
  .f-input::placeholder{ color:var(--text-4); }
  .f-input:hover{ border-color:#B6C4DA; }
  .f-input:focus{ outline:none; border-color:var(--brand-500); box-shadow:var(--shadow-focus); }
  .f-input:read-only{ background:#F7F9FC; color:var(--text-2); }
  select.f-input{ padding-right:30px; cursor:pointer; }
  .f-field.has-error .f-input{ border-color:var(--danger); }
  .f-field.has-error .f-input:focus{ box-shadow:0 0 0 3px rgba(217,56,47,.12); }
  .f-error{ display:none; margin:6px 0 0; font-size:12px; color:var(--danger); }
  .f-field.has-error .f-error{ display:block; }
  .f-hint{ margin:6px 0 0; font-size:12px; color:var(--text-3); line-height:1.6; }
  .f-row{ position:relative; }
  .f-eye{
    position:absolute; right:5px; top:50%; transform:translateY(-50%);
    display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; border:0; border-radius:6px;
    background:transparent; color:var(--text-3); cursor:pointer;
  }
  .f-eye:hover{ background:#F2F5FA; color:var(--brand-600); }
  .f-eye svg{ width:15px; height:15px; }

  /* 拖拽上传 */
  .dropzone{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    padding:38px 20px;
    border:1.5px dashed var(--line-strong); border-radius:var(--radius-lg);
    background:#FBFDFF;
    text-align:center; cursor:pointer;
    transition:border-color .16s ease, background .16s ease;
  }
  .dropzone:hover{ border-color:var(--brand-500); background:var(--brand-soft2); }
  .dropzone.is-over{ border-color:var(--brand-500); background:var(--brand-soft); }
  .dropzone:focus-visible{ outline:2px solid var(--brand-500); outline-offset:2px; }
  .dropzone svg{ width:34px; height:34px; color:#9FB4D2; }
  .dropzone-main{ font-size:13.5px; color:var(--text-1); }
  .dropzone-main b{ color:var(--brand-600); }
  .dropzone-sub{ font-size:12px; color:var(--text-3); line-height:1.6; }
  .file-chip{
    display:flex; align-items:center; gap:10px;
    margin-top:14px; padding:10px 12px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:#fff;
  }
  .file-chip svg{ width:17px; height:17px; color:var(--brand-600); flex:none; }
  .file-chip-name{ flex:1; min-width:0; font-size:13px; overflow:hidden;
                   text-overflow:ellipsis; white-space:nowrap; }
  .file-chip-size{ color:var(--text-3); font-size:12px; }
  .file-remove{
    flex:none; width:24px; height:24px; border:0; border-radius:6px;
    background:transparent; color:var(--text-3); cursor:pointer;
  }
  .file-remove:hover{ background:var(--danger-bg); color:var(--danger); }
  .file-remove svg{ width:13px; height:13px; }

  /* ===================== 确认弹窗 ===================== */
  .modal-mask{
    position:fixed; inset:0; z-index:70;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(17,24,39,.42);
    animation:fadeIn .16s ease both;
  }
  .modal{
    width:440px; max-width:100%;
    border-radius:var(--radius-lg); background:#fff;
    box-shadow:0 24px 60px rgba(12,20,40,.24);
    animation:popIn .18s ease both;
  }
  .modal.is-wide{ width:600px; }
  .modal-head{ display:flex; align-items:center; gap:10px; padding:20px 22px 0; }
  .modal-head svg{ width:20px; height:20px; flex:none; color:var(--danger); }
  .modal-head.is-info svg{ color:var(--brand-600); }
  .modal-head h3{ margin:0; font-size:15.5px; font-weight:650; }
  .modal-body{ padding:12px 22px 4px; font-size:13px; color:var(--text-2); line-height:1.75; }
  .modal-body ul{ margin:8px 0 0; padding-left:18px; }
  .modal-body li{ margin:3px 0; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px 20px; }
  .mini-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px; }
  .mini-table th{
    padding:7px 9px; background:#FAFBFD; border:1px solid var(--line);
    color:var(--text-2); font-weight:600; text-align:left; white-space:nowrap;
  }
  .mini-table td{ padding:7px 9px; border:1px solid var(--line-soft); color:var(--text-1); }
  .mini-table .badge{ height:20px; font-size:11.5px; }
  .mini-table td:first-child{ word-break:break-word; }
  /* 用户组 / 资源组的授权小表：名称列不折行，操作列按内容收紧
     （否则职责说明很长时会把「移出」挤成两行） */
  .mini-table td.col-name{ white-space:nowrap; word-break:normal; }
  .mini-table td.col-act{ width:1%; white-space:nowrap; }

  /* 基本信息弹窗 */
  .modal-head.is-info svg{ color:var(--brand-600); }
  .info-list{ margin:0; }
  .info-row{
    display:flex; gap:14px;
    padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .info-row:last-child{ border-bottom:0; }
  .info-row dt{ flex:none; width:118px; color:var(--text-3); font-size:13px; }
  .info-row dd{ margin:0; flex:1; min-width:0; color:var(--text-1); font-size:13px; line-height:1.6;
                word-break:break-all; }

  /* ===================== 轻提示 ===================== */
  .toast-wrap{
    position:fixed; top:76px; left:50%; transform:translateX(-50%);
    z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none;
  }
  .toast{
    display:flex; align-items:center; gap:9px;
    padding:10px 16px;
    border:1px solid var(--line); border-radius:999px;
    background:#fff; box-shadow:0 10px 30px rgba(12,20,40,.14);
    font-size:13px; color:var(--text-1);
    animation:popIn .18s ease both;
  }
  .toast svg{ width:15px; height:15px; flex:none; }
  .toast.is-ok svg{ color:var(--success); }
  .toast.is-info svg{ color:var(--brand-600); }

  /* ===================== 响应式 ===================== */
  .nav-overlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(17,24,39,.42);
    animation:fadeIn .18s ease both;
  }
  @keyframes fadeIn{ from{ opacity:0 } to{ opacity:1 } }

  @media (max-width:900px){
    .layout{ grid-template-columns:minmax(0,1fr); }
    .sidebar{
      position:fixed; left:0; top:0; bottom:0; z-index:50;
      width:270px;
      transform:translateX(-100%);
      transition:transform .24s cubic-bezier(.22,.61,.36,1);
      box-shadow:0 12px 40px rgba(12,20,40,.18);
    }
    .layout.nav-open .sidebar{ transform:none; }
    .nav-toggle{ display:inline-flex; }
    .content{ padding:18px 16px 28px; }
    .topbar{ padding:0 14px; }
    .user-name{ display:none; }

    /* 账户管理：窄屏下头部动作换行、抽屉全宽 */
    .page-head-row{ flex-direction:column; align-items:stretch; }
    .page-actions{ padding-top:0; }
    .page-actions .btn{ flex:1; }
    .filter-bar{ align-items:stretch; }
    .filter-item{ flex:1 1 100%; }
    .input-search, select.input-sm{ width:100%; flex:1; }
    .drawer{ width:100%; }
    .table-foot{ flex-wrap:wrap; }
  }
  @media (max-width:520px){
    .lang-switch{ padding:2px; }
    .lang-btn{ min-width:40px; padding:0 8px; }
    .page-title{ font-size:19px; }
    .f-grid2{ grid-template-columns:1fr; }      /* 窄屏下高级字段改单列 */
    .wd-grid{ grid-template-columns:repeat(2, 1fr); }   /* 星期多选改两列 */
    .comp-row{ flex-direction:column; gap:8px; }        /* 备份组件名称与内容改上下排布 */
    .des-card.labels-wide .des-row{ flex-direction:column; gap:4px; }   /* 长标签行改上下排布 */
    .comp-name{ width:auto; }
  }
</style>
</head>
<body>

<div class="layout" id="layout">

  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <!-- Logo：可被系统管理员上传的品牌 Logo 整体替换（M11 FR-COM-004） -->
      <a class="logo" href="#/home" aria-label="ModelEngine">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" role="img">
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3B8CFF"/><stop offset="1" stop-color="#1668DC"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="9" fill="url(#logoGrad)"/>
            <path d="M9.5 22V10.5l6.5 6 6.5-6V22" fill="none" stroke="#fff"
                  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="logo-name">ModelEngine</span>
      </a>
    </div>

    <nav class="sidebar-nav" id="sidebarNav" aria-label="主导航">
      <!-- 首页 -->
      <div id="navHome"></div>

      <!-- 上层业务模块注册区（扩展槽）：OMS 自身菜单不占用此区间 -->
      <div class="nav-slot" id="navSlot"></div>

      <!-- 设置（含子条目） -->
      <div id="navSettings"></div>
    </nav>

    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <!-- ==================== 主区 ==================== -->
  <div class="main">
    <header class="topbar">
      <button type="button" class="nav-toggle" id="navToggle" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <!-- 面包屑 -->
      <nav class="crumb" id="crumb" aria-label="面包屑"></nav>

      <div class="topbar-right">
        <!-- 任务中心（FR-COM-002）：常驻顶栏，位于语言切换左侧 -->
        <button type="button" class="top-btn" id="taskCenterBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 6.2h15M4.5 12h15M4.5 17.8h9"/>
          </svg>
          <span data-i18n="taskCenter">任务中心</span>
        </button>

        <!-- 中英文切换 -->
        <div class="lang-switch" role="group" aria-label="语言切换 / Switch language">
          <button type="button" class="lang-btn is-active" data-lang="zh-CN">中文</button>
          <button type="button" class="lang-btn" data-lang="en-US">EN</button>
        </div>

        <!-- 用户菜单 -->
        <div class="user-wrap">
          <button type="button" class="user-btn" id="userBtn" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar" id="userAvatar">管</span>
            <span class="user-name" id="userName">系统管理员</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="user-menu" id="userMenu" role="menu" hidden>
            <div class="user-menu-head">
              <div class="user-menu-name" id="menuUserName">系统管理员</div>
              <div class="user-menu-role" id="menuUserRole" data-i18n="roleAdmin">系统管理员</div>
            </div>
            <button type="button" class="user-menu-item" id="profileBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/>
              </svg>
              <span data-i18n="menuProfile">基本信息</span>
            </button>
            <button type="button" class="user-menu-item" id="selfPwdBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="10.5" width="16" height="10" rx="2.4"/>
                <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/>
              </svg>
              <span data-i18n="menuSelfPwd">修改密码</span>
            </button>
            <button type="button" class="user-menu-item is-danger" id="logoutBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/>
                <path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/>
              </svg>
              <span data-i18n="logout">退出登录</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<div class="nav-overlay" id="navOverlay" hidden></div>

<!-- ==================== 右侧抽屉（创建 / 修改 / 重置密码 / 导入） ==================== -->
<div class="drawer-mask" id="drawerMask" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <div>
      <h2 id="drawerTitle"></h2>
      <p id="drawerSub" hidden></p>
    </div>
    <button type="button" class="drawer-close" id="drawerClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <span class="foot-note" id="drawerNote"></span>
    <button type="button" class="btn" id="drawerExtra" hidden></button>
    <button type="button" class="btn" id="drawerCancel">取消</button>
    <button type="button" class="btn btn-primary" id="drawerSubmit"></button>
  </div>
</aside>

<!-- ==================== 确认弹窗 ==================== -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head" id="modalHead">
      <svg id="modalIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      <h3 id="modalTitle"></h3>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button type="button" class="btn" id="modalCancel">取消</button>
      <button type="button" class="btn btn-danger" id="modalConfirm">确认删除</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<!-- ==================== 基本信息弹窗 ==================== -->
<div class="modal-mask" id="infoMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="modal-head is-info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/>
      </svg>
      <h3 id="infoTitle" data-i18n="infoTitle">基本信息</h3>
    </div>
    <div class="modal-body"><dl class="info-list" id="infoBody"></dl></div>
    <div class="modal-foot">
      <button type="button" class="btn btn-primary" id="infoClose" data-i18n="btnClose">关闭</button>
    </div>
  </div>
</div>

<!-- ==================== 首次登录用户协议弹窗（FR-AUTH-008） ==================== -->
<div class="agr-mask" id="agrMask" hidden>
  <div class="agr" role="dialog" aria-modal="true" aria-labelledby="agrTitle">
    <div class="agr-head">
      <h2 id="agrTitle" data-i18n="agrTitle">用户协议</h2>
      <p data-i18n="agrSub">首次登录需阅读并确认以下条款，确认后方可使用系统功能</p>
    </div>
    <div class="agr-body" id="agrBody" tabindex="0"></div>
    <div class="agr-foot">
      <p class="agr-hint" id="agrHint"></p>
      <button type="button" class="agr-btn" id="agrCancel" data-i18n="agrCancel">取消</button>
      <button type="button" class="agr-btn agr-btn-primary" id="agrConfirm" disabled></button>
    </div>
  </div>
</div>

<!-- ==================== 原型说明浮层（交付时可整段删除） ==================== -->
<div class="proto" data-prototype>
  <div class="proto-panel" id="protoPanel" hidden>
    <h4 data-i18n="protoTitle">原型说明（仅演示用）</h4>

    <div class="proto-field">
      <span class="proto-label" data-i18n="protoRole">当前登录角色</span>
      <div class="proto-seg" id="roleSeg">
        <button type="button" data-role="admin" class="is-on" data-i18n="roleAdmin">系统管理员</button>
        <button type="button" data-role="secadmin" data-i18n="roleSecAdmin">安全管理员</button>
      </div>
    </div>

    <div class="proto-field">
      <span class="proto-label" data-i18n="protoPerm">菜单权限模拟（FR-PERM-002）</span>
      <div class="proto-seg" id="permSeg">
        <button type="button" data-perm="all" class="is-on" data-i18n="permAll">全部</button>
        <button type="button" data-perm="partial" data-i18n="permPartial">部分</button>
        <button type="button" data-perm="none" data-i18n="permNone">无权限</button>

  function userName() { return t(currentRole().key); }

  /* ===================== 权限（FR-PERM-002） ===================== */
  /* 菜单可见性：安全管理员按角色固定收敛为三项；系统管理员按权限模拟集判定 */
  function allowed(id) {
    if (isSecAdmin()) return SECADMIN_ALLOWED.indexOf(id) !== -1;
    if (id === 'security') return false;                    // 安全策略仅安全管理员可见（M15）
    if (state.perm === 'all') return true;
    if (state.perm === 'none') return false;
    return PARTIAL_ALLOWED.indexOf(id) !== -1;
  }
  function visibleSettings() {
    return SETTINGS_CHILDREN.filter(function (c) { return allowed(c.id); });
  }
  /* 上层业务模块菜单同样受授权约束；此处以「无任何权限」场景整体收敛 */
  function modulesVisible() {
    if (isSecAdmin()) return false;        // 安全管理员看不到上层业务模块菜单
    return state.showModules && REGISTERED_MODULES.length > 0 && state.perm !== 'none';
  }
  function hasAnyMenu() {
    return allowed('home') || visibleSettings().length > 0 || modulesVisible();
  }

  /* ===================== 渲染：侧边栏 ===================== */
  function renderSidebar() {
    // 首页
    navHome.innerHTML = allowed('home')
      ? '<a class="nav-item' + (state.route === '#/home' ? ' is-active' : '') + '" href="#/home">' +
        icon('home', 'nav-icon') + '<span class="nav-text">' + t('navHome') + '</span></a>'
      : '';

    // 上层业务模块注册区（扩展槽）
    if (modulesVisible()) {
      navSlot.innerHTML = REGISTERED_MODULES.map(function (m) {
        var active = state.route === m.route;
        return '<a class="nav-item' + (active ? ' is-active' : '') + '" href="' + m.route + '">' +
               icon('module', 'nav-icon') +
               '<span class="nav-text">' + label(m) + '</span>' +
               '<span class="nav-badge">' + t('badgeExample') + '</span></a>';
      }).join('');
    } else if (!isSecAdmin() && state.perm !== 'none') {
      // 未注册任何上层模块时的占位提示（安全管理员视角不展示该区）
      navSlot.innerHTML = '<div class="nav-slot-empty">' + t('slotEmpty') + '</div>';
    } else {
      navSlot.innerHTML = '';
    }

    // 设置（子菜单有权限而父级无权限时，父级按「可达原则」展示）
    var kids = visibleSettings();
    if (kids.length) {
      // 按分组渲染：多条目的组带组名，单条目组直接平铺
      var kidsHTML = SETTINGS_GROUPS.map(function (grp) {
        var items = grp.ids.map(function (id) {
          return SETTINGS_CHILDREN.filter(function (c) { return c.id === id; })[0];
        }).filter(function (c) { return c && allowed(c.id); });
        if (!items.length) return '';
        var grouped = !!grp.key && items.length > 1;   // 只剩一项时按单条目组平铺
        return (grouped ? '<div class="nav-group-label">' + t(grp.key) + '</div>' : '') +
          items.map(function (c) {
            var active = state.route === c.route;
            return '<a class="nav-child' + (grouped ? ' is-grouped' : '') +
                   (active ? ' is-active' : '') + '" href="' + c.route + '">' +
                   label(c) + '</a>';
          }).join('');
      }).join('');

      navSettings.innerHTML =
        '<div class="nav-group' + (state.settingsOpen ? ' is-open' : '') + '" id="settingsGroup">' +
          '<button type="button" class="nav-item nav-group-head" id="settingsHead" ' +
                  'aria-expanded="' + state.settingsOpen + '">' +
            icon('settings', 'nav-icon') +
            '<span class="nav-text">' + t('navSettings') + '</span>' +
            icon('chevron', 'nav-chevron') +
          '</button>' +
          '<div class="nav-children"><div>' + kidsHTML + '</div></div>' +
        '</div>';
      $('settingsHead').addEventListener('click', function () {
        state.settingsOpen = !state.settingsOpen;
        $('settingsGroup').classList.toggle('is-open', state.settingsOpen);
        this.setAttribute('aria-expanded', String(state.settingsOpen));
      });
    } else {
      navSettings.innerHTML = '';
    }

    $('sidebarFoot').textContent = t('sidebarFoot');
  }

  /* ===================== 渲染：顶部 ===================== */
  function renderTopbar() {
    var items = [];
    if (!hasAnyMenu()) {
      items = [{ text: t('noPermBadge'), current: true }];
    } else if (state.route === '#/home') {
      items = [{ text: t('navHome'), current: true }];
    } else if (state.route === '#/tasks') {
      items = [{ text: t('taskCenter'), current: true }];
    } else {
      var hit = SETTINGS_CHILDREN.filter(function (c) { return c.route === state.route; })[0];
      var mod = REGISTERED_MODULES.filter(function (m) { return m.route === state.route; })[0];
      if (hit) items = [{ text: t('navSettings') }, { text: label(hit), current: true }];
      else if (mod) items = [{ text: label(mod), current: true }];  // 上层模块是顶层菜单，不挂在「设置」下
      else items = [{ text: t('navHome'), current: true }];
    }
    crumb.innerHTML = items.map(function (it, i) {
      return (i ? '<span class="crumb-sep">/</span>' : '') +
             '<span class="crumb-item' + (it.current ? ' is-current' : '') + '">' + it.text + '</span>';
    }).join('');

    $('userAvatar').textContent = currentRole().initial;
    $('userName').textContent = userName();
    $('menuUserName').textContent = userName();

    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-lang') === state.lang);
    });

    var tc = $('taskCenterBtn');
    if (tc) tc.classList.toggle('is-active', state.route === '#/tasks');
  }

  /* ===================== 运行日志（M09） =====================
     列：文件名 / 收集时间段 / 状态（成功·失败·运行中）/ 创建时间 / 操作（下载·删除）
     文件名即日志收集后打包的压缩包文件名 */
  var RT_LOGS = [
    { file: 'modelengine-logs-20261013-1435.zip', from: '2026-10-11 14:35', to: '2026-10-13 14:35',
      status: 'running', at: '2026-10-13 14:35:02' },
    { file: 'modelengine-logs-20261013-1020.zip', from: '2026-10-13 06:20', to: '2026-10-13 10:20',
      status: 'ok',      at: '2026-10-13 10:20:31' },
    { file: 'modelengine-logs-20261013-0930.zip', from: '2026-10-13 07:30', to: '2026-10-13 09:30',
      status: 'fail',    at: '2026-10-13 09:30:18' },
    { file: 'modelengine-logs-20261012-1830.zip', from: '2026-10-12 14:30', to: '2026-10-12 18:30',
      status: 'ok',      at: '2026-10-12 18:30:12' },
    { file: 'modelengine-logs-20261012-1015.zip', from: '2026-10-12 08:00', to: '2026-10-12 10:00',
      status: 'ok',      at: '2026-10-12 10:15:44' },
    { file: 'modelengine-logs-20261011-0900.zip', from: '2026-10-09 09:00', to: '2026-10-11 09:00',
      status: 'ok',      at: '2026-10-11 09:00:07' }
  ];

  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDateTime(d) {
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' +
           p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function fmtDateTimeSec(d) { return fmtDateTime(d) + ':' + p2(d.getSeconds()); }

  function rtStatusName(st) {
    return st === 'ok' ? t('rtStatusOk') : (st === 'fail' ? t('rtStatusFail') : t('rtStatusRunning'));
  }

  }

  function rtRowHTML(r) {

      '<td class="col-range">' + esc(r.from) + ' ~ ' + esc(r.to) + '</td>' +
      '<td><span class="badge ' + rtStatusClass(r.status) + '">' + rtStatusName(r.status) + '</span></td>' +

          t('rtDelete') + '</button>' +

    content.innerHTML =

            '<th>' + t('rtColCreated') + '</th>' +
            '<th>' + t('rtColOp') + '</th>' +
          '</tr></thead>' +
          '<tbody>' + (RT_LOGS.length ? RT_LOGS.map(rtRowHTML).join('') :

            t('rtEmpty') + '</td></tr>') + '</tbody>' +

      '</div>';

  }

  function bindRunlogPage() {
    content.querySelectorAll('table.data tbody tr[data-file]').forEach(function (tr) {
      var name = tr.getAttribute('data-file');
      tr.querySelectorAll('[data-rt]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.getAttribute('data-rt') === 'download') {
            if (b.disabled) return;
            // 实际实现：下载本地日志包（FR-RTLOG-004）
            toast(tf('toastRtDownload', { name: name }), 'ok');
          } else {
            openConfirmModal({
              title: t('delRtTitle'),
              bodyHTML: '<p>' + tf('delRtBody', { name: esc(name) }) + '</p>',
              confirmText: t('delRtConfirm'),
              danger: true,
              onConfirm: function () {
                var i = RT_LOGS.map(function (x) { return x.file; }).indexOf(name);
                if (i >= 0) RT_LOGS.splice(i, 1);
                renderRunlogPage();
                toast(tf('toastRtDeleted', { name: name }), 'ok');
              }
            });
          }
        });
      });
    });
    $('btnCollectLog').addEventListener('click', function () { openDrawer('rtlog', null); });
    $('btnQuickCollect').addEventListener('click', openQuickCollect);
  }

  /* 一键信息收集：固定收集系统状态、关键配置与 48 小时内的运行日志（FR-RTLOG-001） */
  function openQuickCollect() {
    openConfirmModal({
      title: t('rtQuickTitle'),
      bodyHTML: '<p>' + t('rtQuickBody') + '</p>',
      confirmText: t('rtQuickConfirm'),
      danger: false,
      onConfirm: function () {
        var now = new Date();
        var from = new Date(now.getTime() - 48 * 3600 * 1000);
        var stamp = fmtDateTime(now).replace(/[-: ]/g, '').slice(0, 12);
        RT_LOGS.unshift({
          file: 'modelengine-info-' + stamp + '.zip',
          from: fmtDateTime(from), to: fmtDateTime(now),
          status: 'running', at: fmtDateTimeSec(now)
        });
        renderRunlogPage();
        toast(t('toastRtQuick'), 'ok');
      }
    });
  }

  /* ===================== 操作日志（M08） =====================

  var LOG_TYPES = [

  var OPERATION_LOGS = [

    { op: { zh: '激活账户', en: 'Activate account' },      tk: 'account',       tn: 'liuyang',             user: 'secadmin',   ip: '10.20.30.52', type: 'seclog', ok: true,  at: '2026-10-13 09:41:07' },
    { op: { zh: '修改安全策略', en: 'Update security policy' }, tk: 'pwdPolicy', tn: '',                   user: 'secadmin',   ip: '10.20.30.52', type: 'seclog', ok: true,  at: '2026-10-13 10:02:18' },
    { op: { zh: '重置密码', en: 'Reset password' },        tk: 'account',       tn: 'sunlei',              user: 'admin',      ip: '10.20.30.41', type: 'seclog', ok: true,  at: '2026-10-13 10:15:44' },
    { op: { zh: '登录 OMS', en: 'Sign in to OMS' },        tk: 'session',       tn: '',                    user: 'zhangwei',   ip: '10.20.30.77', type: 'oplog',  ok: true,  at: '2026-10-13 10:21:09' },
    { op: { zh: '登录 OMS', en: 'Sign in to OMS' },        tk: 'session',       tn: '',                    user: 'liuyang',    ip: '10.20.30.91', type: 'oplog',  ok: false, at: '2026-10-13 10:23:52' },
    { op: { zh: '导入账户', en: 'Import accounts' },       tk: 'batch',         tn: '20261012-01',         user: 'admin',      ip: '10.20.30.41', type: 'seclog', ok: true,  at: '2026-10-12 16:30:11' },
    { op: { zh: '导出操作日志', en: 'Export operation logs' }, tk: 'log',       tn: '',                    user: 'secauditor', ip: '10.20.30.63', type: 'oplog',  ok: true,  at: '2026-10-12 17:05:26' },
    { op: { zh: '修改账户', en: 'Edit account' },          tk: 'account',       tn: 'wangfang',            user: 'admin',      ip: '10.20.30.41', type: 'seclog', ok: true,  at: '2026-10-12 17:22:40' },
    { op: { zh: '查看在线用户', en: 'View online users' }, tk: 'session',       tn: '',                    user: 'secadmin',   ip: '10.20.30.52', type: 'oplog',  ok: true,  at: '2026-10-12 18:01:03' },
    { op: { zh: '删除账户', en: 'Delete account' },        tk: 'account',       tn: 'testuser',            user: 'admin',      ip: '10.20.30.41', type: 'seclog', ok: false, at: '2026-10-12 18:14:55' },
    { op: { zh: '会话剔除', en: 'Terminate session' },     tk: 'account',       tn: 'sunlei',              user: 'secadmin',   ip: '10.20.30.52', type: 'seclog', ok: true,  at: '2026-10-11 14:38:12' }
  ];

  var LOG_PAGE_SIZE = 10;
  var logFilter = { q: '', user: '', type: '', ok: '', from: '', to: '' };
  var logPage = 1;

  function logTarget(row) {
    var zh = state.lang === 'zh-CN';
    if (row.tk === 'account') return (zh ? '账户 ' : 'Account ') + row.tn;
    if (row.tk === 'batch') return (zh ? '账户批次 ' : 'Batch ') + row.tn;
    if (row.tk === 'session') return zh ? '会话' : 'Session';
    if (row.tk === 'log') return zh ? '操作日志' : 'Operation logs';
    if (row.tk === 'pwdPolicy') return zh ? '密码策略' : 'Password policy';
    return row.tn;
  }
  function logTypeName(id) {
    var t0 = LOG_TYPES.filter(function (x) { return x.id === id; })[0];
    return t0 ? t(t0.key) : id;
  }
  function logOpName(row) { return state.lang === 'zh-CN' ? row.op.zh : row.op.en; }

  function filteredLogs() {
    var q = logFilter.q.trim().toLowerCase();
    return OPERATION_LOGS.filter(function (r) {
      if (q) {
        var hay = (logOpName(r) + ' ' + logTarget(r)).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (logFilter.user && r.user !== logFilter.user) return false;
      if (logFilter.type && r.type !== logFilter.type) return false;
      if (logFilter.ok !== '' && String(r.ok) !== logFilter.ok) return false;
      var day = r.at.slice(0, 10);
      if (logFilter.from && day < logFilter.from) return false;
      if (logFilter.to && day > logFilter.to) return false;
      return true;
    });
  }

  function logRowHTML(r) {
    return '<tr>' +
      '<td>' + esc(logOpName(r)) + '</td>' +
      '<td class="col-group">' + esc(logTarget(r)) + '</td>' +
      '<td>' + esc(r.user) + '</td>' +
      '<td class="col-ip">' + esc(r.ip) + '</td>' +
      '<td><span class="badge badge-plain">' + logTypeName(r.type) + '</span></td>' +
      '<td><span class="badge ' + (r.ok ? 'badge-ok' : 'badge-fail') + '">' +
        (r.ok ? t('logOk') : t('logFail')) + '</span></td>' +
      '<td class="col-ip">' + esc(r.at) + '</td>' +
    '</tr>';
  }

  function renderLogPage() {
    var rows = filteredLogs();
    var totalPages = Math.max(1, Math.ceil(rows.length / LOG_PAGE_SIZE));

            }).join('') +
          '</select></div>' +
        '<div class="filter-item"><span>' + t('logColType') + '</span>' +
          '<select class="input-sm" id="logtype">' +
            '<option value="">' + t('accAll') + '</option>' +
            LOG_TYPES.map(function (x) {
              return '<option value="' + x.id + '"' + (logFilter.type === x.id ? ' selected' : '') +
                     '>' + t(x.key) + '</option>';
            }).join('') +
          '</select></div>' +
        '<div class="filter-item"><span>' + t('logColStatus') + '</span>' +
          '<select class="input-sm" id="logok">' +
            '<option value=""' + (logFilter.ok === '' ? ' selected' : '') + '>' + t('accAll') + '</option>' +

      '<div class="table-card">' +
