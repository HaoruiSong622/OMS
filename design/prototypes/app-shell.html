            '<button type="button" id="logPrev"' + (logPage <= 1 ? ' disabled' : '') + '>' +
              t('logPrev') + '</button>' +
            '<span class="pager-info">' + tf('logPageInfo', { p: logPage, t: totalPages }) + '</span>' +
            '<button type="button" id="logNext"' + (logPage >= totalPages ? ' disabled' : '') + '>' +
              t('logNext') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    bindLogPage();
  }

  function bindLogPage() {
    var q = $('logq');
    q.addEventListener('input', function () {
      logFilter.q = this.value; logPage = 1; renderLogPage(); q.focus();
    });
    [['loguser', 'user'], ['logtype', 'type'], ['logok', 'ok']].forEach(function (pair) {
      $(pair[0]).addEventListener('change', function () {
        logFilter[pair[1]] = this.value; logPage = 1; renderLogPage();
      });
    });
    [['logfrom', 'from'], ['logto', 'to']].forEach(function (pair) {
      $(pair[0]).addEventListener('change', function () {
        logFilter[pair[1]] = this.value; logPage = 1; renderLogPage();
      });
    });
    $('logFilterReset').addEventListener('click', function () {
      logFilter = { q: '', user: '', type: '', ok: '', from: '', to: '' };
      logPage = 1; renderLogPage();
    });
    $('logPrev').addEventListener('click', function () { if (logPage > 1) { logPage--; renderLogPage(); } });
    $('logNext').addEventListener('click', function () {
      var tp = Math.max(1, Math.ceil(filteredLogs().length / LOG_PAGE_SIZE));
      if (logPage < tp) { logPage++; renderLogPage(); }
    });
    $('logExport').addEventListener('click', function () {
      // 实际实现：按当前筛选条件导出 CSV（FR-OPLOG-003）
      toast(tf('toastLogExport', { n: filteredLogs().length }), 'ok');
    });
  }

  /* ===================== 安全策略（M15）：字段定义 =====================
     每项 = 展示名（i18n key）+ 取值范围（min/max，或布尔）+ 默认值
     dep: [开关字段, 值] 表示该开关取此值时本项可编辑，否则置灰 */
  var POLICY = {
    account: [
      { id: 'maxAccounts',    key: 'polMaxAccounts',    type: 'int',  min: 0,  max: 1024, def: 50, unit: 'unitCount' },
      { id: 'minNameLen',     key: 'polMinNameLen',     type: 'int',  min: 1,  max: 32,   def: 1,  unit: 'unitChars' },
      { id: 'maxNameLen',     key: 'polMaxNameLen',     type: 'int',  min: 1,  max: 64,   def: 32, unit: 'unitChars' },
      { id: 'failThreshold',  key: 'polFailThreshold',  type: 'int',  min: 3,  max: 5,    def: 5,  unit: 'unitTimes' },
      { id: 'failWindow',     key: 'polFailWindow',     type: 'int',  min: 3,  max: 30,   def: 5,  unit: 'unitMin',
        hint: 'polFailWindowHint' },
      { id: 'lockDuration',   key: 'polLockDuration',   type: 'int',  min: 10, max: 30,   def: 10, unit: 'unitMin' },
      { id: 'allowSameName',  key: 'polAllowSameName',  type: 'bool', def: false, hint: 'polAllowSameNameHint' }
    ],
    password: [
      { id: 'minPwdLen',           key: 'polMinPwdLen',           type: 'int',  min: 8,  max: 32,  def: 8,  unit: 'unitChars' },
      { id: 'maxPwdLen',           key: 'polMaxPwdLen',           type: 'int',  min: 8,  max: 32,  def: 32, unit: 'unitChars' },
      { id: 'requireSpecial',      key: 'polRequireSpecial',      type: 'bool', def: true },
      { id: 'allowUsername',       key: 'polAllowUsername',       type: 'bool', def: false },
      { id: 'weakCheck',           key: 'polWeakCheck',           type: 'bool', def: true },
      { id: 'forceChangeOnReset',  key: 'polForceChangeOnReset',  type: 'bool', def: false },
      { id: 'historyCount',        key: 'polHistoryCount',        type: 'int',  min: 0,  max: 5,   def: 5,  unit: 'unitTimes' },
      { id: 'neverExpire',         key: 'polNeverExpire',         type: 'bool', def: false },
      { id: 'maxAge',              key: 'polMaxAge',              type: 'int',  min: 30, max: 999, def: 90, unit: 'unitDay',
        dep: ['neverExpire', false] },
      { id: 'changeInterval',      key: 'polChangeInterval',      type: 'int',  min: 3,  max: 10,  def: 5,  unit: 'unitMin' },
      { id: 'expireWarn',          key: 'polExpireWarn',          type: 'int',  min: 3,  max: 10,  def: 7,  unit: 'unitDay',
        dep: ['neverExpire', false] }
    ],
    session: [
      { id: 'sessionTimeout', key: 'polSessionTimeout', type: 'int', min: 5, max: 120, def: 10, unit: 'unitMin' },
      { id: 'maxSessions',    key: 'polMaxSessions',    type: 'int', min: 1, max: 50,  def: 10, unit: 'unitCount' }
    ]
  };

  /* 当前取值（初始为默认值） */
  var polValues = {};
  Object.keys(POLICY).forEach(function (grp) {
    POLICY[grp].forEach(function (f) {
      polValues[f.id] = (f.type === 'bool') ? String(f.def) : f.def;
    });
  });

  function fieldsOf(grp) { return POLICY[grp]; }
  function fieldById(id) {
    var all = POLICY.account.concat(POLICY.password, POLICY.session);
    return all.filter(function (f) { return f.id === id; })[0];
  }
  function isFieldEnabled(f) {
    if (!f.dep) return true;
    return String(polValues[f.dep[0]]) === String(f.dep[1]);
  }

  function polRowHTML(f) {
    var ctrl;
    if (f.type === 'bool') {
      ctrl = '<div class="pol-seg" data-bool="' + f.id + '">' +
        '<button type="button" class="pol-seg-btn' + (String(polValues[f.id]) === 'true' ? ' is-on' : '') +
          '" data-val="true">' + t('yes') + '</button>' +
        '<button type="button" class="pol-seg-btn' + (String(polValues[f.id]) === 'false' ? ' is-on' : '') +
          '" data-val="false">' + t('no') + '</button>' +
      '</div>';
    } else {
      ctrl = '<input class="pol-input" type="number" inputmode="numeric" id="pol_' + f.id + '"' +
             ' min="' + f.min + '" max="' + f.max + '" value="' + polValues[f.id] + '"' +
             (isFieldEnabled(f) ? '' : ' disabled') + ' />' +
             '<span class="pol-unit">' + (t(f.unit) || '') + '</span>';
    }
    var meta = (f.type === 'int') ? tf('secRange', { min: f.min, max: f.max }) : '';
    if (f.hint) meta = meta ? (t(f.hint) + ' · ' + meta) : t(f.hint);
    return '<div class="pol-row' + (isFieldEnabled(f) ? '' : ' is-disabled') +
             '" data-field="' + f.id + '">' +
      '<div class="pol-label">' +
        '<span class="pol-name">' + t(f.key) + '</span>' +
        (meta ? '<span class="pol-meta">' + meta + '</span>' : '') +
      '</div>' +
      '<div class="pol-control">' + ctrl + '</div>' +
    '</div>';
  }

  function polCardHTML(grp, iconName) {
    var fs = fieldsOf(grp);
    return '<section class="pol-card" data-group="' + grp + '">' +
      '<div class="pol-head">' + icon(iconName) +
        '<h2>' + t(grp === 'account' ? 'secAccount' : (grp === 'password' ? 'secPassword' : 'secSession')) + '</h2>' +
        '<span class="pol-count">' + tf('secItemCount', { n: fs.length }) + '</span>' +
      '</div>' +
      '<div class="pol-body">' + fs.map(polRowHTML).join('') + '</div>' +
    '</section>';
  }

  function renderSecurityPage() {
    content.innerHTML =
      '<div class="page-head">' +
        '<h1 class="page-title">' + t('secTitle') + '</h1>' +
        '<p class="page-sub">' + t('secSub') + '</p>' +
      '</div>' +
      polCardHTML('account', 'shield') +
      polCardHTML('password', 'lock') +
      polCardHTML('session', 'user') +
      '<div class="pol-actions">' +
        '<span class="pol-note">' + t('secNote') + '</span>' +
        '<button type="button" class="btn" id="secReset">' + t('secResetDefault') + '</button>' +
        '<button type="button" class="btn btn-primary" id="secSave">' + t('secSave') + '</button>' +
      '</div>';
    bindSecurityPage();
  }

  function bindSecurityPage() {
    content.querySelectorAll('.pol-input').forEach(function (el) {
      el.addEventListener('input', function () {
        var id = el.id.replace('pol_', '');
        polValues[id] = el.value;
        el.closest('.pol-row').classList.remove('has-error');
      });
    });
    content.querySelectorAll('[data-bool]').forEach(function (seg) {
      var id = seg.getAttribute('data-bool');
      seg.querySelectorAll('.pol-seg-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          polValues[id] = b.getAttribute('data-val');
          renderSecurityPage();          // 布尔值可能影响其它项的可编辑状态
        });
      });
    });
    $('secSave').addEventListener('click', saveSecurityPolicy);
    $('secReset').addEventListener('click', function () {
      Object.keys(POLICY).forEach(function (grp) {
        POLICY[grp].forEach(function (f) {
          polValues[f.id] = (f.type === 'bool') ? String(f.def) : f.def;
        });
      });
      renderSecurityPage();
      toast(t('toastSecReset'), 'ok');
    });
  }

  /* 保存校验：数值需落在取值范围内，且最短长度不得大于最长长度 */
  function saveSecurityPolicy() {
    var bad = null;
    ['account', 'password', 'session'].forEach(function (grp) {
      POLICY[grp].forEach(function (f) {
        if (f.type !== 'int' || !isFieldEnabled(f)) return;
        var el = $('pol_' + f.id);
        var v = String(el.value).trim();
        var row = el.closest('.pol-row');
        row.classList.remove('has-error');
        if (v === '' || isNaN(Number(v))) {
          row.classList.add('has-error');
          row.querySelector('.pol-meta').textContent = t('polErrEmpty');
          bad = bad || f;
          return;
        }
        var n = Number(v);
        if (n < f.min || n > f.max) {
          row.classList.add('has-error');
          row.querySelector('.pol-meta').textContent = tf('polErrRange', { min: f.min, max: f.max });
          bad = bad || f;
          return;
        }
        polValues[f.id] = n;
      });
    });
    // 长度上下限关系
    [['minNameLen', 'maxNameLen'], ['minPwdLen', 'maxPwdLen']].forEach(function (pair) {
      if (Number(polValues[pair[0]]) > Number(polValues[pair[1]])) {
        var row = content.querySelector('[data-field="' + pair[1] + '"]');
        if (row) {
          row.classList.add('has-error');
          row.querySelector('.pol-meta').textContent = t('polErrLen');
        }
        bad = bad || fieldById(pair[1]);
      }
    });
    if (bad) {
      var first = content.querySelector('.pol-row.has-error');
      if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    toast(t('toastSecSaved'), 'ok');
  }

  /* ===================== 账户管理：数据 ===================== */
  /* 用户组：来自 M04 用户组管理；一个账户只能归属一个用户组（FR-RG-003） */
  var GROUPS = [
    { id: 'g-sysadmin', zh: '系统管理员组', en: 'System Admins', builtin: true,
      desc: { zh: '承载平台全部管理能力的系统管理员账户', en: 'Accounts holding the platform system administrator capability' } },
    { id: 'g-secadmin', zh: '安全管理员组', en: 'Security Admins', builtin: true,
      desc: { zh: '负责安全策略、账户激活与锁定的安全管理员账户', en: 'Accounts responsible for security policies and account activation' } },
    { id: 'g-secauditor', zh: '审计管理员组', en: 'Auditors', builtin: true,
      desc: { zh: '负责日志审计与授权关系查看的审计管理员账户', en: 'Accounts responsible for log audit and authorization review' } },
    { id: 'g-ops', zh: '运维组', en: 'Operations',

    { id: 'g-readonly', zh: '只读审计组', en: 'Read-only',
      desc: { zh: '仅需只读查看资源的业务审计人员', en: 'Business auditors with read-only access' } }
  ];
  function groupDesc(g) { return state.lang === 'zh-CN' ? g.desc.zh : g.desc.en; }

  /* ---------- 资源组与纳管资源（M04 FR-RG-001 / FR-RG-004） ----------
     资源由上层业务模块维护，OMS 只维护「资源归属资源组」与「资源组授权用户组」两类关系。
     grants = 该资源组已授权的用户组 id；用户组页面的「已关联资源组」由这里反查得到。 */
  var RESOURCE_GROUPS = [
    { id: 'rg-sysadmin', zh: '系统管理员资源组', en: 'System Administrators', builtin: true,
      desc: { zh: '内置资源组：系统管理员可见的全部资源的承载组',
              en: 'Built-in group holding all resources visible to the system administrator' },
      grants: ['g-sysadmin'] },
    { id: 'rg-prod', zh: '生产资源组', en: 'Production',
      desc: { zh: '生产环境的模型部署与训练资源', en: 'Model deployment and training resources in production' },
      grants: ['g-sysadmin', 'g-ops', 'g-readonly'] },
    { id: 'rg-dev', zh: '开发测试资源组', en: 'Dev & Test',
      desc: { zh: '开发与测试环境的资源，供日常联调使用', en: 'Resources for development and testing' },
      grants: ['g-sysadmin', 'g-ops'] },
    { id: 'rg-shared', zh: '共享资源组', en: 'Shared',
      desc: { zh: '跨部门共享的公共资源', en: 'Public resources shared across departments' },
      grants: ['g-sysadmin', 'g-secauditor'] }
  ];
  var RESOURCES = [
    { id: 'res-1', zh: '推理服务-prod-01', en: 'Inference-prod-01', type: 'deploy', module: 'deploy', group: 'rg-prod' },
    { id: 'res-2', zh: '推理服务-prod-02', en: 'Inference-prod-02', type: 'deploy', module: 'deploy', group: 'rg-prod' },
    { id: 'res-3', zh: '训练集群-dev', en: 'Training-dev', type: 'train', module: 'train', group: 'rg-dev' },
    { id: 'res-4', zh: '推理服务-test-01', en: 'Inference-test-01', type: 'deploy', module: 'deploy', group: 'rg-dev' },
    { id: 'res-5', zh: '训练集群-test', en: 'Training-test', type: 'train', module: 'train', group: '' },
    { id: 'res-6', zh: '推理服务-dev-03', en: 'Inference-dev-03', type: 'deploy', module: 'deploy', group: '' }
  ];

  function rgById(id) { return RESOURCE_GROUPS.filter(function (g) { return g.id === id; })[0]; }
  function rgName(g) { return state.lang === 'zh-CN' ? g.zh : g.en; }
  function rgDesc(g) { return state.lang === 'zh-CN' ? g.desc.zh : g.desc.en; }
  function resOfGroup(id) {
    return RESOURCES.filter(function (r) { return r.group === id; });
  }
  function resName(r) { return state.lang === 'zh-CN' ? r.zh : r.en; }
  function resTypeName(r) { return r.type === 'deploy' ? t('resTypeDeploy') : t('resTypeTrain'); }
  function resModuleName(r) {
    var m = REGISTERED_MODULES.filter(function (x) { return x.id === 'biz-' + r.module; })[0];
    return m ? label(m) : r.module;
  }
  /* 用户组已关联的资源组（由资源组的 grants 反查） */
  function groupsOfResourceGroup(rgId) {
    var rg = rgById(rgId);
    if (!rg) return [];
    return rg.grants.map(function (id) { return groupOf(id); }).filter(Boolean);
  }
  function resGroupsOfUserGroup(gid) {
    return RESOURCE_GROUPS.filter(function (rg) { return rg.grants.indexOf(gid) !== -1; });
  }
  /* 用户组成员 = 归属该用户组的账户（M04 FR-RG-003，与账户管理共用一份数据） */
  function membersOfGroup(gid) {
    return ACCOUNTS.filter(function (a) { return a.group === gid; });
  }

  /* 账户列表。
     builtin = 系统内置账户（admin / secadmin / secauditor）：隐藏「重置密码」「删除账户」
     auth    = local 本地认证 | sso 三方SSO认证
     status  = active 已激活 | locked 已锁定
               新建账户即为锁定状态（即需求中的「待激活」，已并入锁定），
               须由安全管理员激活后方可登录（FR-ACC-002 / FR-ACC-005）
     备注    = 本地账号创建时为空值；仅外部账号（三方SSO认证）由导入写入
     online  = 与「会话管理」页的在线会话保持一致：有在线会话的账户即为在线（FR-AUTH-004）
     注：三方SSO认证账户不在 OMS 侧存储凭据，不能重置密码（FR-ACC-006） */
  var ACCOUNTS = [
    { name: 'admin', builtin: true, status: 'active', group: 'g-sysadmin', auth: 'local',
      email: 'admin@modelengine.local', online: true, remark: { zh: '', en: '' } },
    { name: 'secadmin', builtin: true, status: 'active', group: 'g-secadmin', auth: 'local',
      email: 'secadmin@modelengine.local', online: true, remark: { zh: '', en: '' } },
    { name: 'secauditor', builtin: true, status: 'active', group: 'g-secauditor', auth: 'local',
      email: 'secauditor@modelengine.local', online: true, remark: { zh: '', en: '' } },
    { name: 'zhangwei', status: 'active', group: 'g-ops', auth: 'local',
      email: 'zhangwei@example.com', online: true, remark: { zh: '', en: '' } },
    { name: 'liuyang', status: 'locked', group: 'g-ops', auth: 'local',
      email: 'liuyang@example.com', online: false, remark: { zh: '', en: '' } },
    { name: 'chenjing', status: 'active', group: 'g-readonly', auth: 'sso',
      email: 'chenjing@example.com', online: true,
      remark: { zh: '由 SSO 导入', en: 'Imported via SSO' } },
    { name: 'wangfang', status: 'active', group: 'g-ops', auth: 'sso',
      email: 'wangfang@example.com', online: true,
      remark: { zh: '由 SSO 导入', en: 'Imported via SSO' } },
    { name: 'sunlei', status: 'locked', group: 'g-readonly', auth: 'local',
      email: 'sunlei@example.com', online: false, remark: { zh: '', en: '' } }
  ];

  var accFilter = { q: '', status: '', auth: '', group: '' };
  var accSelected = {};                 // 已勾选的账户名（内置账户不可选）

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function groupOf(id) {
    return GROUPS.filter(function (g) { return g.id === id; })[0];
  }
  function groupName(id) {
    var g = groupOf(id);
    return g ? (state.lang === 'zh-CN' ? g.zh : g.en) : id;
  }
  function remarkOf(a) { return state.lang === 'zh-CN' ? a.remark.zh : a.remark.en; }
  function findAccount(name) {
    return ACCOUNTS.filter(function (a) { return a.name === name; })[0];
  }
  /* 重置密码是否可用：内置账户隐藏；外部账号（SSO）不在 OMS 侧存凭据，禁用（FR-ACC-006） */
  function canResetPwd(a) { return !a.builtin && a.auth !== 'sso'; }

  /* 可被选中的账户（内置账户不可选） */
  function selectedNames() {
    return Object.keys(accSelected).filter(function (n) {
      var a = findAccount(n);
      return accSelected[n] && a && !a.builtin;
    });
  }

  function filteredAccounts() {
    var q = accFilter.q.trim().toLowerCase();
    return ACCOUNTS.filter(function (a) {
      if (q && a.name.toLowerCase().indexOf(q) === -1 &&
          a.email.toLowerCase().indexOf(q) === -1) return false;
      if (accFilter.status && a.status !== accFilter.status) return false;
      if (accFilter.auth && a.auth !== accFilter.auth) return false;
      if (accFilter.group && a.group !== accFilter.group) return false;
      return true;
    });
  }

  /* ===================== 账户管理：页面 ===================== */
  var ACC_COLUMNS = ['colName', 'colStatus', 'colGroup', 'colAuth',
                     'colEmail', 'colRemark', 'colOnline', 'colOp'];

  /* 勾选列仅在系统管理员视图出现（安全管理员没有删除能力） */
  function showCheckColumn() { return !isSecAdmin(); }
  function accColSpan() { return ACC_COLUMNS.length + (showCheckColumn() ? 1 : 0); }

  function accRowHTML(a) {
    /* 安全管理员视图：操作列只有「锁定 / 激活」，没有修改、重置密码、删除 */
    var actions;
    if (isSecAdmin()) {
      /* 安全管理员只允许锁定本地普通账户：
         ① admin / secadmin / secauditor 三个内置账户不允许锁定（FR-ACC-004）
         ② 三方SSO认证账户不允许锁定
         两者都不提供「锁定 / 激活」操作，用占位符保持表格对齐 */
      if (a.builtin || a.auth === 'sso') {
        actions = '<span class="cell-empty" title="' +
                  esc(t(a.builtin ? 'tipBuiltinNoLock' : 'tipSSONoLock')) + '">—</span>';
      } else {
        var locking = a.status === 'active';
        actions = '<button type="button" class="link-btn" data-act="' +
                  (locking ? 'lock' : 'activate') + '" data-name="' + esc(a.name) + '">' +
                  (locking ? t('opLock') : t('opActivate')) + '</button>';
      }
      return accRowShell(a, actions);
    }

    var resetBtn;
    if (a.builtin) {
      resetBtn = '';                                   // 内置账户：隐藏
    } else if (canResetPwd(a)) {
      resetBtn = '<button type="button" class="link-btn" data-act="reset" data-name="' +
                 esc(a.name) + '">' + t('opResetPwd') + '</button>';
    } else {
      resetBtn = '<button type="button" class="link-btn" disabled title="' +
                 esc(t('tipSSONoReset')) + '">' + t('opResetPwd') + '</button>';
    }
    actions = '<button type="button" class="link-btn" data-act="edit" data-name="' + esc(a.name) + '">' +
                t('opEdit') + '</button>' +
              resetBtn +
              (a.builtin ? '' :
                '<button type="button" class="link-btn is-danger" data-act="delete" data-name="' +
                esc(a.name) + '">' + t('opDelete') + '</button>');
    return accRowShell(a, actions);
  }

  /* 行骨架：两个角色视图共用同一套列 */
  function accRowShell(a, actionsHTML) {
    var checkCell = showCheckColumn()
      ? '<td class="col-check">' +
          '<input type="checkbox" class="row-check" data-name="' + esc(a.name) + '"' +
          (a.builtin ? ' disabled title="' + esc(t('tipBuiltinNoSelect')) + '"' : '') +
          (accSelected[a.name] ? ' checked' : '') + ' /></td>'
      : '';
    return '<tr data-name="' + esc(a.name) + '">' + checkCell +
      '<td><span class="cell-name"><b>' + esc(a.name) + '</b>' +
        (a.builtin ? '<span class="badge badge-builtin">' + t('badgeBuiltin') + '</span>' : '') +
      '</span></td>' +

  function bindAccountPage() {
    if ($('btnCreate')) $('btnCreate').addEventListener('click', function () { openDrawer('create', null); });
    if ($('btnImport')) $('btnImport').addEventListener('click', function () { openDrawer('import', null); });

    var fq = $('fq');
    fq.addEventListener('input', function () { accFilter.q = this.value; rerenderTableOnly(); });
    ['fstatus:status', 'fauth:auth', 'fgroup:group'].forEach(function (pair) {
      var p = pair.split(':');
      $(p[0]).addEventListener('change', function () {
        accFilter[p[1]] = this.value; rerenderTableOnly();
      });
    });
    bindCheckAll();
    if ($('btnBatchDelete')) $('btnBatchDelete').addEventListener('click', openBatchDeleteModal);
    $('btnFilterReset').addEventListener('click', function () {
      accFilter = { q: '', status: '', auth: '', group: '' };
      renderAccountPage();
    });

    bindRowActions();

  function bindRowChecks() {
    if (!showCheckColumn()) return;
    content.querySelectorAll('.row-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var n = cb.getAttribute('data-name');
        if (cb.checked) accSelected[n] = true; else delete accSelected[n];
        syncSelectionUI();
      });
    });
  }

  /* 全选：仅作用于当前筛选结果中的可选账户（内置账户不参与） */
  function bindCheckAll() {
    var all = $('checkAll');
    if (!all) return;
    all.addEventListener('change', function () {
      var selectable = filteredAccounts().filter(function (a) { return !a.builtin; });
      selectable.forEach(function (a) {
        if (all.checked) accSelected[a.name] = true; else delete accSelected[a.name];
      });
      rerenderTableOnly();          // 重绘表体勾选态，并同步按钮/页脚
    });
  }

  /* 同步按钮可用态、计数、全选态与页脚（不重绘表体，避免打断勾选） */
  function syncSelectionUI() {
    var n = selectedNames().length;
    var btn = $('btnBatchDelete');
    if (btn) {
      btn.disabled = n === 0;
      var c = $('batchCount');
      if (c) c.textContent = n ? '（' + n + '）' : '';
    }
    var all = $('checkAll');
    if (all) {
      var selectable = filteredAccounts().filter(function (a) { return !a.builtin; });
      var picked = selectable.filter(function (a) { return accSelected[a.name]; }).length;
      all.disabled = selectable.length === 0;
      all.checked = selectable.length > 0 && picked === selectable.length;
      all.indeterminate = picked > 0 && picked < selectable.length;
    }
    var foot = content.querySelector('.table-foot span');
    if (foot) {
      foot.textContent = tf('accFoot', {
        n: filteredAccounts().length, total: ACCOUNTS.length,
        b: ACCOUNTS.filter(function (a) { return a.builtin; }).length
      }) + (n ? ' · ' + tf('accFootSelected', { n: n }) : '');
    }
  }

  /* 行内操作分发：admin 视图为 修改 / 重置密码 / 删除，secadmin 视图为 锁定 / 激活 */
  function bindRowActions() {
    bindRowChecks();
    bindRowChecks();
    content.querySelectorAll('.row-actions .link-btn[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = findAccount(b.getAttribute('data-name'));
        if (!a) return;
        var act = b.getAttribute('data-act');
        if (act === 'edit') openDrawer('edit', a);
        else if (act === 'reset') openDrawer('reset', a);
        else if (act === 'delete') openDeleteModal(a);
        else if ((act === 'lock' || act === 'activate') &&
                 !a.builtin && a.auth !== 'sso') {
          a.status = act === 'lock' ? 'locked' : 'active';
          if (act === 'lock') {
            a.online = false;                  // 锁定会终止该账户在线会话（FR-ACC-004）
            dropSessionsOf([a.name]);          // 会话管理页同步移除该账户的会话
          }
          renderAccountPage();
          toast(tf(act === 'lock' ? 'toastLocked' : 'toastActivated', { name: a.name }), 'ok');
        }
      });
    });
  }

  /* ===================== 会话管理（M02 FR-AUTH-004 在线用户查询与剔除） =====================
     列：账户名称 / 客户端IP地址 / 用户组 / 登录时间 / 在线时间 / 操作（删除）
     行首勾选框支持多选 + 批量删除；会话剔除仅终止 OMS 本地会话，不触发上层业务客户端的单点登出。
     一个账户可有多个会话：不同浏览器或无痕模式各自建立独立会话（M15 会话策略按会话数量判定）。 */
  var SESSION_NOW = new Date(2026, 9, 13, 14, 0, 0);   // 原型基准时刻，用于计算「在线时间」
  var SESSIONS = [
    { id: 'sess-1', name: 'secauditor', ip: '10.20.30.71',  group: 'g-secauditor', loginAt: '2026-10-13 13:48:10' },
    { id: 'sess-2', name: 'chenjing',   ip: '10.20.30.63',  group: 'g-readonly',   loginAt: '2026-10-13 13:22:55' },
    { id: 'sess-3', name: 'secadmin',   ip: '10.20.30.52',  group: 'g-secadmin',   loginAt: '2026-10-13 11:40:07' },
    { id: 'sess-4', name: 'zhangwei',   ip: '10.20.30.102', group: 'g-ops',        loginAt: '2026-10-13 10:12:30' },
    { id: 'sess-5', name: 'wangfang',   ip: '10.20.30.88',  group: 'g-ops',        loginAt: '2026-10-13 09:05:44' },
    { id: 'sess-6', name: 'zhangwei',   ip: '10.20.30.77',  group: 'g-ops',        loginAt: '2026-10-13 08:30:12' },
    { id: 'sess-7', name: 'admin',      ip: '10.20.30.41',  group: 'g-sysadmin',   loginAt: '2026-10-13 08:00:00' }
  ];

  var sessSelected = {};                 // 已勾选的会话 id

  var SESS_COLUMNS = ['sessColName', 'sessColIp', 'sessColGroup',
                      'sessColLogin', 'sessColOnline', 'sessColOp'];
  function sessColSpan() { return SESS_COLUMNS.length + 1; }

  function findSession(id) {
    return SESSIONS.filter(function (s) { return s.id === id; })[0];
  }
  function selectedSessIds() {
    return Object.keys(sessSelected).filter(function (id) {
      if (!sessSelected[id]) return false;
      if (!findSession(id)) { delete sessSelected[id]; return false; }   // 会话已被剔除时清理残留勾选
      return true;
    });
  }

  function parseDateTime(str) {
    var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})(?::(\d{2}))?$/.exec(str);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
  }
  /* 在线时间 = 登录时间 → 基准时刻的时长 */
  function fmtDuration(from, to) {
    var mins = Math.max(0, Math.round((to - from) / 60000));
    var h = Math.floor(mins / 60), m = mins % 60;
    if (state.lang === 'zh-CN') {
      if (h && m) return h + ' 小时 ' + m + ' 分钟';
      return h ? h + ' 小时' : m + ' 分钟';
    }
    if (h && m) return h + 'h ' + m + 'min';
    return h ? h + 'h' : m + 'min';
  }
  function sessOnlineText(s) {
    var from = parseDateTime(s.loginAt);
    return from ? fmtDuration(from, SESSION_NOW) : '—';
  }

  function sessRowHTML(s) {
    return '<tr data-sid="' + esc(s.id) + '">' +
      '<td class="col-check">' +
        '<input type="checkbox" class="row-check" data-sid="' + esc(s.id) + '"' +
        (sessSelected[s.id] ? ' checked' : '') + ' /></td>' +
      '<td><span class="cell-name"><b>' + esc(s.name) + '</b></span></td>' +
      '<td class="col-ip">' + esc(s.ip) + '</td>' +
      '<td class="col-group">' + esc(groupName(s.group)) + '</td>' +
      '<td class="col-ip">' + esc(s.loginAt) + '</td>' +
      '<td class="col-dur">' + esc(sessOnlineText(s)) + '</td>' +
      '<td><div class="row-actions">' +
        '<button type="button" class="link-btn is-danger" data-sdel="' + esc(s.id) + '">' +
          t('sessDelete') + '</button>' +
      '</div></td>' +
    '</tr>';
  }

  function sessEmptyHTML() {
    return '<tr><td colspan="' + sessColSpan() +

  function renderSessionPage() {
    content.innerHTML =
      '<div class="page-head-row">' +
        '<div class="page-head">' +
          '<h1 class="page-title">' + t('sessTitle') + '</h1>' +
          '<p class="page-sub">' + t('sessSub') + '</p>' +
        '</div>' +
        '<div class="page-actions">' +
          '<button type="button" class="btn btn-danger" id="btnSessBatchDelete"' +
            (selectedSessIds().length ? '' : ' disabled') + '>' + t('sessBatchDelete') +
            '<span class="batch-count" id="sessBatchCount">' +
              (selectedSessIds().length ? '（' + selectedSessIds().length + '）' : '') +

      '<div class="table-card">' +
        '<div class="table-scroll"><table class="data">' +
          '<thead><tr>' +
            '<th class="col-check"><input type="checkbox" class="check-all" id="sessCheckAll" ' +
              'aria-label="' + esc(t('accSelectAll')) + '" /></th>' +
            SESS_COLUMNS.map(function (k) { return '<th>' + t(k) + '</th>'; }).join('') +
          '</tr></thead>' +
          '<tbody>' + (SESSIONS.length ? SESSIONS.map(sessRowHTML).join('') : sessEmptyHTML()) +
          '</tbody>' +
        '</table></div>' +
        '<div class="table-foot">' +
          '<span>' + tf('sessFoot', { n: SESSIONS.length }) + '</span>' +
          '<span class="filter-spacer"></span>' +
          '<span>' + t('sessFootHint') + '</span>' +
        '</div>' +
      '</div>';

    $('sessCheckAll').addEventListener('change', function () {
      var on = $('sessCheckAll').checked;
      SESSIONS.forEach(function (s) {
        if (on) sessSelected[s.id] = true; else delete sessSelected[s.id];
      });
      rerenderSessionTable();
    });
    $('btnSessBatchDelete').addEventListener('click', openSessionBatchDeleteModal);
    bindSessionRows();

  function bindSessionRows() {
    content.querySelectorAll('.row-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-sid');
        if (cb.checked) sessSelected[id] = true; else delete sessSelected[id];
        syncSessSelectionUI();
      });
    });
    content.querySelectorAll('[data-sdel]').forEach(function (b) {
      b.addEventListener('click', function () {
        var s = findSession(b.getAttribute('data-sdel'));
        if (s) openSessionDeleteModal(s);
      });
    });
  }

  /* 只重绘表体：勾选与剔除后同步勾选态、按钮与页脚 */
  function rerenderSessionTable() {
    var tbody = content.querySelector('table.data tbody');
    if (!tbody) return;
    tbody.innerHTML = SESSIONS.length ? SESSIONS.map(sessRowHTML).join('') : sessEmptyHTML();
    bindSessionRows();
    syncSessSelectionUI();
  }

  function syncSessSelectionUI() {
    var n = selectedSessIds().length;
    var btn = $('btnSessBatchDelete');
    if (btn) {
      btn.disabled = n === 0;
      var c = $('sessBatchCount');
      if (c) c.textContent = n ? '（' + n + '）' : '';
    }
    var all = $('sessCheckAll');
    if (all) {
      all.checked = SESSIONS.length > 0 && n === SESSIONS.length;
      all.indeterminate = n > 0 && n < SESSIONS.length;
    }
    var foot = content.querySelector('.table-foot span');
    if (foot) {
      foot.textContent = tf('sessFoot', { n: SESSIONS.length }) +
        (n ? ' · ' + tf('accFootSelected', { n: n }) : '');
    }
  }

  /* 账户被锁定或删除时，其在线会话一并终止（FR-ACC-004） */
  function dropSessionsOf(names) {
    SESSIONS = SESSIONS.filter(function (s) { return names.indexOf(s.name) === -1; });
  }

  var sessPending = [];                  // 待剔除的会话 id
  function openSessionDeleteModal(s) {
    sessPending = [s.id];
    openConfirmModal({
      title: t('delSessTitle'),
      bodyHTML: '<p>' + tf('delSessBody', { name: esc(s.name) }) + '</p>' +
                '<ul><li>' + t('delSessNote') + '</li></ul>',
      confirmText: t('delSessConfirm'),
      danger: true,
      onConfirm: function () { deleteSessions(sessPending); }
    });
  }

  function openSessionBatchDeleteModal() {
    var ids = selectedSessIds();
    if (!ids.length) return;
    sessPending = ids;
    var names = ids.map(function (id) { return findSession(id).name; })
                   .filter(function (v, i, a) { return a.indexOf(v) === i; });
    openConfirmModal({
      title: t('delSessBatchTitle'),
      bodyHTML: '<p>' + tf('delSessBatchBody', { n: ids.length }) + '</p>' +
                '<p class="batch-list">' + names.map(esc).join('、') + '</p>' +
                '<ul><li>' + t('delSessNote') + '</li></ul>',
      confirmText: t('delSessConfirm'),
      danger: true,
      onConfirm: function () { deleteSessions(sessPending); }
    });
  }

  function deleteSessions(ids) {
    var n = ids.length;
    SESSIONS = SESSIONS.filter(function (s) { return ids.indexOf(s.id) === -1; });
    ids.forEach(function (id) { delete sessSelected[id]; });
    // 会话终止后账户不再处于在线状态，账户管理页的在线状态列保持一致
    ACCOUNTS.forEach(function (a) {
      a.online = SESSIONS.some(function (s) { return s.name === a.name; });
    });
    renderSessionPage();
    toast(n > 1 ? tf('toastSessBatchDeleted', { n: n }) : t('toastSessDeleted'), 'ok');
  }

  /* ===================== 证书管理（M13） =====================
     系统仅使用 Nginx 证书，因此列表固定只有一条数据：证书名称 nginx / 证书别名 nginx_cert。

    content: [

      ['certIssuer', 'CN=ModelEngine CA, O=Huawei, C=CN'],

      ['certTypeLabelValue', 'X.509'],
      ['certSigAlg', 'SHA256withRSA'],
      ['certNotBefore', '2026-01-01 00:00:00'],
      ['certNotAfter', '2027-01-01 00:00:00']
    ],

      ['certTypeLabelValue', 'X.509'],
      ['certSigAlg', 'SHA256withRSA'],
      ['certNotBefore', '2025-01-01 00:00:00'],
      ['certNotAfter', '2035-01-01 00:00:00']
    ]
  };

  /* 常用名（CN）默认取当前软件登录网址或 IP；原型从 file:// 打开时无 host，回落为 127.0.0.1 */
  function currentHost() {
    var h = location.host || location.hostname;
    return h && h !== '' ? h : '127.0.0.1';
  }

  function certStatusName(s) {
    return s === 'expiring' ? t('certStatusExpiring')
         : (s === 'expired' ? t('certStatusExpired') : t('certStatusOk'));
  }
  function certStatusClass(s) {
    return s === 'expiring' ? 'badge-warn' : (s === 'expired' ? 'badge-fail' : 'badge-ok');
  }
  function certCaStatusName(s) {
    return s === 'expired' ? t('certCaExpired')
         : (s === 'missing' ? t('certCaMissing') : t('certCaOk'));
  }

  function certRowHTML() {

  /* ---------- SNMP 接入（FR-3RD-001） ---------- */
  var SNMP_VERSIONS = [

  var UNREACHABLE_HOSTS = ['192.0.2.1', '198.51.100.1', '2001:db8::1'];
  var SNMP_PORT_DEFAULT = '162';

  var SNMP_LIST = [
    { id: 'snmp-1', name: '网管中心 Trap 接收', version: 'v3', verify: true,
      port: '162', ip: '192.168.10.21', user: 'oms_trap',
      authAlg: 'SHA-256', privAlg: 'AES-128', pwdCheck: true,
      lang: 'zh-CN', report: ['alarm'], engineId: '0x80001F8880E9A1B2C3D4E5F6',
      enabled: true, desc: '上报至运维网管中心的 SNMP Trap 接收端' },

  function snmpById(id) {

  /* ---------- 地址格式 ---------- */
  function ipv4Ok(s) {
    var parts = String(s).split('.');
    if (parts.length !== 4) return false;
    return parts.every(function (p) {
      return /^\d{1,3}$/.test(p) && Number(p) <= 255;
    });
  }
  function ipv6Ok(s) {
    if (String(s).indexOf(':') === -1) return false;
    if (s.indexOf('::') !== s.lastIndexOf('::')) return false;
    var groups = [];
    s.split('::').forEach(function (part) {
      if (part) groups = groups.concat(part.split(':'));
    });
    if (s.indexOf('::') === -1 && groups.length !== 8) return false;
    if (s.indexOf('::') !== -1 && groups.length > 7) return false;
    return groups.every(function (g) { return /^[0-9a-fA-F]{1,4}$/.test(g); });
  }
  function ipOk(s) { return ipv4Ok(s) || ipv6Ok(s); }
  function portOk(v) {
    return /^\d{1,5}$/.test(v) && Number(v) >= 1 && Number(v) <= 65535;

  function sftpTestNow() {

    if (!ipOk(d.host)) return 'errIpFormat';
    if (!portOk(d.port)) return 'errSnmpPort';

                                : (drawerState.sftpTestError ? ' is-bad-msg' : ''));

  /* ===================== 告警列表（M17 告警管理） =====================
     当前告警＝未清除的告警；历史告警＝已清除的告警。
     清除即 M17 的「告警清除」：清除后从当前告警移出、转入历史告警，并记录清除时间与清除类型。
     列：级别 / 名称 / 部件类型 / 告警对象 / 告警来源 / 产生时间（历史告警另有清除时间、清除类型）；

  var almTab = 'current';                 // current 当前告警 | history 历史告警
  var almSelected = {};                   // 已勾选的当前告警 id
  var almFilter = { q: '', level: '', part: '', ip: '', from: '', to: '' };
  var almSort = { key: 'at', dir: 'desc' };   // 默认按产生时间倒序

  function alarmList() { return almTab === 'current' ? CURRENT_ALARMS : HISTORY_ALARMS; }
  function alarmName(a) { return state.lang === 'zh-CN' ? a.nm.zh : a.nm.en; }

                                      major: 'lvMajor', critical: 'lvCritical' }[lv]); }

  function partName(id) {
    var p = ALARM_PARTS.filter(function (x) { return x.id === id; })[0];

  function findAlarm(id) {
    return CURRENT_ALARMS.concat(HISTORY_ALARMS)
      .filter(function (a) { return a.id === id; })[0];

  function selectedAlarmIds() {
    return Object.keys(almSelected).filter(function (id) {

  /* 筛选 + 排序（当前视图） */
  function alarmSortValue(a, key) {
    if (key === 'level') return ALARM_LEVELS.indexOf(a.level);
    if (key === 'name') return alarmName(a);
    if (key === 'ip') return a.ip;
    if (key === 'clearedAt') return a.clearedAt || '';

  function filteredViewAlarms() {
    var q = almFilter.q.trim().toLowerCase();
    var list = alarmList().filter(function (a) {
      if (q && alarmName(a).toLowerCase().indexOf(q) === -1 &&
          (a.code || '').toLowerCase().indexOf(q) === -1) return false;
      if (almFilter.level && a.level !== almFilter.level) return false;
      if (almFilter.part && a.part !== almFilter.part) return false;
      if (almFilter.ip && a.ip !== almFilter.ip) return false;
      var day = a.at.slice(0, 10);
      if (almFilter.from && day < almFilter.from) return false;
      if (almFilter.to && day > almFilter.to) return false;
      return true;
    });
    list.sort(function (x, y) {
      var vx = alarmSortValue(x, almSort.key), vy = alarmSortValue(y, almSort.key);
      if (vx === vy) return 0;
      var asc = vx < vy;
      return (almSort.dir === 'asc') === asc ? -1 : 1;
    });
    return list;
  }

          '<h1 class="page-title">' + t('almTitle') + '</h1>' +
          '<p class="page-sub">' + t('almSub') + '</p>' +
        '</div>' +
        '<div class="page-actions">' +

          '</span></button>' +
        '<button type="button" class="tab' + (hist ? ' is-on' : '') + '" data-tab="history">' +
          t('almTabHistory') + '<span class="tab-count">' + countTag(HISTORY_ALARMS.length) +
          '</span></button>' +
      '</div>' +

      '<div class="filter-bar">' +
        '<div class="filter-item">' +
          '<input class="input-sm input-search alm-search" id="almq" type="search" ' +
                 'placeholder="' + esc(t('almSearchPh')) + '" value="' + esc(almFilter.q) + '" />' +
        '</div>' +
        '<div class="filter-item"><span>' + t('almColLevel') + '</span>' +
          '<select class="input-sm" id="almlevel">' +
            filterOptions(ALARM_LEVELS.map(function (lv) {
              return { v: lv, label: levelName(lv) };
            }), almFilter.level, 'accAll') +
          '</select></div>' +
        '<div class="filter-item"><span>' + t('almColPart') + '</span>' +
          '<select class="input-sm" id="almpart">' +
            filterOptions(ALARM_PARTS.map(function (p) {
              return { v: p.id, label: t(p.key) };
            }), almFilter.part, 'accAll') +
          '</select></div>' +
        '<div class="filter-item"><span>' + t('almColIp') + '</span>' +
          '<select class="input-sm alm-ip" id="almip">' +

              return { v: ip, label: ip };
            }), almFilter.ip, 'accAll') +
          '</select></div>' +
        '<div class="filter-item"><span>' + t('logTimeShort') + '</span>' +
          '<input class="input-sm input-date log-date" id="almfrom" type="date" value="' +
            esc(almFilter.from) + '" />' +
          '<span class="filter-sep">~</span>' +
          '<input class="input-sm input-date log-date" id="almto" type="date" value="' +

        '<button type="button" class="btn" id="almFilterReset">' + t('accFilterReset') + '</button>' +
      '</div>' +

      '<div class="table-card">' +
        '<div class="table-scroll"><table class="data">' +
          '<thead><tr>' +
            (hist ? '' :
              '<th class="col-check"><input type="checkbox" class="check-all" id="almCheckAll" ' +
                'aria-label="' + esc(t('accSelectAll')) + '" /></th>') +
            sortTh('level', 'almColLevel') +
            sortTh('name', 'almColName') +
            '<th>' + t('almColPart') + '</th>' +
            '<th>' + t('almColObj') + '</th>' +
            sortTh('ip', 'almColIp') +
            sortTh('at', 'almColAt') +
            (hist ? sortTh('clearedAt', 'almColClearedAt') +
                    '<th>' + t('almColClearedBy') + '</th>' : '') +
            '<th>' + t('almColOp') + '</th>' +
          '</tr></thead>' +
          '<tbody>' + (list.length ? list.map(almRowHTML).join('') :
            '<tr><td colspan="' + almColSpan() +
            '" style="text-align:center;color:var(--text-3);padding:38px 0;">' +
            (alarmFilterActive() ? t('almNoMatch')
                                 : t(hist ? 'almEmptyHistory' : 'almEmptyCurrent')) +
            '</td></tr>') +
          '</tbody>' +
        '</table></div>' +
        '<div class="table-foot">' +
          '<span>' + tf(hist ? 'almFootHistory' : 'almFootCurrent', { n: list.length }) +
            (alarmFilterActive() ? ' · ' + tf('almFootFiltered', { total: total }) : '') +
            (selectedAlarmIds().length
              ? ' · ' + tf('accFootSelected', { n: selectedAlarmIds().length }) : '') +
          '</span>' +
          '<span class="filter-spacer"></span>' +
          '<span>' + t('almFootHint') + '</span>' +
        '</div>' +
      '</div>';

    bindAlarmPage();

  function bindAlarmPage() {
    content.querySelectorAll('.tab').forEach(function (b) {
      b.addEventListener('click', function () {
        almTab = b.getAttribute('data-tab');
        if (almTab === 'current' && almSort.key === 'clearedAt') {
          almSort = { key: 'at', dir: 'desc' };        // 切回当前告警时排序键回落
        }
        renderAlarmPage();
      });
    });

    // 排序：点击表头切换升 / 降序
    content.querySelectorAll('th.th-sort').forEach(function (th) {
      th.addEventListener('click', function () {
        var key = th.getAttribute('data-sort');
        if (almSort.key === key) {
          almSort.dir = almSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          almSort = { key: key, dir: (key === 'at' || key === 'clearedAt') ? 'desc' : 'asc' };
        }
        renderAlarmPage();
      });
    });

    // 筛选
    $('almq').addEventListener('input', function () {
      almFilter.q = this.value;
      rerenderAlarmTable();
    });
    ['almlevel:level', 'almpart:part', 'almip:ip',
     'almfrom:from', 'almto:to'].forEach(function (pair) {
      var p = pair.split(':');
      $(p[0]).addEventListener('change', function () {
        almFilter[p[1]] = this.value;
        rerenderAlarmTable();
      });
    });
    $('almFilterReset').addEventListener('click', function () {
      almFilter = { q: '', level: '', part: '', ip: '', from: '', to: '' };
      renderAlarmPage();
    });

    $('btnAlmExport').addEventListener('click', function () {
      toast(tf('toastAlmExport', {
        view: t(almTab === 'current' ? 'almTabCurrent' : 'almTabHistory'),
        n: alarmList().length
      }), 'ok');
    });
    if ($('btnAlmBatch')) $('btnAlmBatch').addEventListener('click', openAlarmBatchClearModal);

    var all = $('almCheckAll');
    if (all) {
      all.addEventListener('change', function () {
        var on = all.checked;
        CURRENT_ALARMS.forEach(function (a) {
          if (on) almSelected[a.id] = true; else delete almSelected[a.id];
        });
        rerenderAlarmTable();
      });
    }

    bindAlarmRows();
    syncAlarmSelectionUI();
  }

  /* 只重绘表体与页脚（筛选时保持输入焦点） */
  function rerenderAlarmTable() {
    var list = filteredViewAlarms();
    var tbody = content.querySelector('table.data tbody');
    if (!tbody) return;
    tbody.innerHTML = list.length ? list.map(almRowHTML).join('') :
      '<tr><td colspan="' + almColSpan() +
      '" style="text-align:center;color:var(--text-3);padding:38px 0;">' +
      (alarmFilterActive() ? t('almNoMatch')
                           : t(almTab === 'history' ? 'almEmptyHistory' : 'almEmptyCurrent')) +
      '</td></tr>';
    var foot = content.querySelector('.table-foot span');
    if (foot) {
      foot.textContent = tf(almTab === 'history' ? 'almFootHistory' : 'almFootCurrent',
                            { n: list.length }) +
        (alarmFilterActive() ? ' · ' + tf('almFootFiltered', { total: alarmList().length }) : '') +
        (selectedAlarmIds().length
          ? ' · ' + tf('accFootSelected', { n: selectedAlarmIds().length }) : '');
    }
    bindAlarmRows();
    syncAlarmSelectionUI();       // 表体重绘后同步批量按钮 / 计数 / 全选态
  }

  /* 行内勾选与操作（表体重绘后需要重新绑定） */
  function bindAlarmRows() {
    content.querySelectorAll('.row-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-alm');
        if (cb.checked) almSelected[id] = true; else delete almSelected[id];
        syncAlarmSelectionUI();
      });
    });
    content.querySelectorAll('[data-alm-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = findAlarm(b.closest('tr').getAttribute('data-alarm'));
        if (!a) return;
        if (b.getAttribute('data-alm-act') === 'clear') openAlarmClearModal(a);
        else openBlockDrawer(a);
      });
    });
  }

  /* 同步批量清除按钮、计数、全选态与页脚已选数 */
  function syncAlarmSelectionUI() {
    var n = selectedAlarmIds().length;
    var btn = $('btnAlmBatch');
    if (btn) {
      btn.disabled = n === 0;
      var c = $('almBatchCount');
      if (c) c.textContent = n ? countTag(n) : '';
    }
    var all = $('almCheckAll');
    if (all) {
      all.checked = CURRENT_ALARMS.length > 0 && n === CURRENT_ALARMS.length;
      all.indeterminate = n > 0 && n < CURRENT_ALARMS.length;
    }
    var foot = content.querySelector('.table-foot span');
    if (foot) {
      foot.textContent = tf(almTab === 'history' ? 'almFootHistory' : 'almFootCurrent',
                            { n: filteredViewAlarms().length }) +
        (alarmFilterActive()
          ? ' · ' + tf('almFootFiltered', { total: alarmList().length }) : '') +
        (n ? ' · ' + tf('accFootSelected', { n: n }) : '');
    }
  }

  /* 二次确认弹窗里的告警信息：单条用「字段-取值」两列，多条用三列表格 */
  function alarmDetailTable(a) {
    return '<table class="mini-table"><tbody>' +
      '<tr><th>' + t('almFieldName') + '</th><td>' + esc(alarmName(a)) + '</td></tr>' +
      '<tr><th>' + t('almColLevel') + '</th><td><span class="badge ' + levelClass(a.level) + '">' +
        levelName(a.level) + '</span></td></tr>' +
      '<tr><th>' + t('almColPart') + '</th><td>' + esc(partName(a.part)) + '</td></tr>' +
    '</tbody></table>';
  }
  function alarmListTable(list) {
    return '<table class="mini-table"><thead><tr>' +
      '<th>' + t('almFieldName') + '</th><th>' + t('almColLevel') + '</th>' +
      '<th>' + t('almColPart') + '</th></tr></thead><tbody>' +
      list.map(function (a) {
        return '<tr><td>' + esc(alarmName(a)) + '</td>' +
          '<td><span class="badge ' + levelClass(a.level) + '">' + levelName(a.level) +
            '</span></td>' +
          '<td>' + esc(partName(a.part)) + '</td></tr>';
      }).join('') +
    '</tbody></table>';
  }

  /* 清除：当前告警 → 历史告警（记录清除时间与清除类型） */
  function openAlarmClearModal(a) {
    openConfirmModal({
      title: t('clrTitle'),
      bodyHTML: '<p>' + t('clrBody') + '</p>' + alarmDetailTable(a),
      confirmText: t('clrConfirm'),
      danger: true,
      onConfirm: function () { clearAlarms([a.id]); }
    });
  }
  function openAlarmBatchClearModal() {
    var ids = selectedAlarmIds();
    if (!ids.length) return;
    var list = ids.map(findAlarm).filter(Boolean);
    openConfirmModal({
      title: t('clrBatchTitle'),
      bodyHTML: '<p>' + tf('clrBatchBody', { n: list.length }) + '</p>' + alarmListTable(list),
      confirmText: t('clrConfirm'),
      danger: true,
      wide: true,
      onConfirm: function () { clearAlarms(ids); }
    });
  }
  function clearAlarms(ids) {
    var n = 0;
    ids.slice().forEach(function (id) {
      var idx = -1;
      CURRENT_ALARMS.forEach(function (a, k) { if (a.id === id) idx = k; });
      if (idx < 0) return;
      var a = CURRENT_ALARMS.splice(idx, 1)[0];
      a.clearedAt = fmtDateTimeSec(new Date());
      a.clearedBy = 'manual';                 // 页面手动清除；模块上报恢复时为自动清除
      HISTORY_ALARMS.unshift(a);
      delete almSelected[id];
      n++;
    });
    if (!n) return;
    renderAlarmPage();
    toast(tf('toastAlmCleared', { n: n }), 'ok');
  }

  /* 设置屏蔽规则：屏蔽项 / 规则名称 / 描述 / 屏蔽日期 / 屏蔽时间段（FR-ALM-003） */
  function radioRow(name, value, label, current) {
    var on = current === value;
    return '<label class="radio-item' + (on ? ' is-on' : '') + '">' +
      '<input type="radio" class="radio-input" name="' + name + '" value="' + value + '"' +
      (on ? ' checked' : '') + ' />' +
      '<span>' + label + '</span></label>';
  }
  /* 告警列表里创建的屏蔽规则，落到「告警设置」的规则表（两个页面共用一份数据） */
  function addRuleFromAlarm(a, scope, name, desc, dMode, from, to, tMode, start, end) {
    var sources = scope === 'ip'
      ? sourceCandidates().filter(function (s) { return s.ip === a.ip; })
          .map(function (s) { return { ip: s.ip, part: s.part, obj: s.obj }; })
      : [{ ip: a.ip, part: a.part, obj: a.obj }];
    BLOCK_RULES.push({
      id: 'r' + (BLOCK_RULES.length + 1) + '-' + Date.now(),
      name: name, enabled: true,
      dateMode: dMode, from: from, to: to, timeMode: tMode, start: start, end: end,
      desc: desc,
      srcMode: 'custom', sources: sources,
      nameMode: scope === 'ip' ? 'all' : 'custom',
      alarms: scope === 'ip' ? [] : [{ id: a.id, ip: a.ip, code: a.code, nm: a.nm }],
      at: fmtDateTimeSec(new Date())
    });
  }

  function openBlockDrawer(a) {
    openDrawer('alarmblock', null, {
      blockAlarm: a, blkScope: 'ip', blkDateMode: 'forever', blkTimeMode: '24h'
    });
  }

  /* ===================== 用户组管理（M04 FR-RG-002 / FR-RG-003 / FR-ROLE-002） =====================
     列：用户组名称 / 用途说明 / 成员数量 / 已绑定角色 / 已关联资源组 / 操作（成员·权限配置·删除）
     成员来自账户管理（ACCOUNTS.group），已绑定角色来自 GROUP_ROLES，
     已关联资源组由资源组的 grants 反查，三处均为同一份数据。 */
  var ugFilter = { q: '' };

  function filteredUserGroups() {
    var q = ugFilter.q.trim().toLowerCase();
    return GROUPS.filter(function (g) {
      if (!q) return true;
      return (g.zh + ' ' + g.en + ' ' + g.desc.zh + ' ' + g.desc.en).toLowerCase().indexOf(q) !== -1;
    });
  }
  function roleNamesOfGroup(gid) {
    return (GROUP_ROLES[gid] || []).map(roleName);
  }
  function resGroupNamesOfUserGroup(gid) {
    return resGroupsOfUserGroup(gid).map(rgName);
  }
  function joinNames(list) {
    return list.length ? list.join(state.lang === 'zh-CN' ? '、' : ', ') : '';
  }
  function userGroupRowHTML(g) {
    var roles = joinNames(roleNamesOfGroup(g.id));
    var rgs = joinNames(resGroupNamesOfUserGroup(g.id));
    return '<tr data-ug="' + esc(g.id) + '">' +
      '<td><span class="cell-name"><b>' + esc(groupName(g.id)) + '</b>' +
        (g.builtin ? '<span class="badge badge-builtin">' + t('badgeBuiltin') + '</span>' : '') +
      '</span></td>' +
      '<td class="col-remark" title="' + esc(groupDesc(g)) + '">' +
        '<span class="remark-text group-desc cell-desc">' + esc(groupDesc(g)) + '</span></td>' +
      '<td>' + esc(tf('memberUnit', { n: membersOfGroup(g.id).length })) + '</td>' +
      '<td>' + (roles ? '<span class="cell-tags" title="' + esc(roles) + '">' + esc(roles) + '</span>'
                      : '<span class="cell-empty">—</span>') + '</td>' +
      '<td>' + (rgs ? '<span class="cell-tags" title="' + esc(rgs) + '">' + esc(rgs) + '</span>'
                    : '<span class="cell-empty">—</span>') + '</td>' +
      '<td><div class="row-actions">' +
        '<button type="button" class="link-btn" data-ug-act="edit">' + t('ruleEdit') + '</button>' +
        '<button type="button" class="link-btn" data-ug-act="members">' + t('ugMembers') + '</button>' +
        '<button type="button" class="link-btn" data-ug-act="perm">' + t('ugPerm') + '</button>' +
        (g.builtin
          ? '<button type="button" class="link-btn is-danger" disabled title="' +
            esc(t('tipBuiltinNoDelete')) + '">' + t('ruleDelete') + '</button>'
          : '<button type="button" class="link-btn is-danger" data-ug-act="delete">' +
            t('ruleDelete') + '</button>') +
      '</div></td>' +
    '</tr>';
  }

  function renderUserGroupPage() {
    var rows = filteredUserGroups();
    content.innerHTML =
      '<div class="page-head-row">' +
        '<div class="page-head">' +
          '<h1 class="page-title">' + t('ugTitle') + '</h1>' +
          '<p class="page-sub">' + t('ugSub') + '</p>' +
        '</div>' +
        '<div class="page-actions">' +
          '<button type="button" class="btn btn-primary" id="btnUgCreate">' + icon('plus') +
            t('ugCreate') + '</button>' +
        '</div>' +
      '</div>' +

      '<div class="filter-bar">' +
        '<div class="filter-item">' +
          '<input class="input-sm input-search" id="ugq" type="search" ' +
                 'placeholder="' + esc(t('ugSearchPh')) + '" value="' + esc(ugFilter.q) + '" />' +
        '</div>' +
        '<button type="button" class="btn" id="ugFilterReset">' + t('accFilterReset') + '</button>' +
      '</div>' +

      '<div class="table-card">' +
        '<div class="table-scroll"><table class="data">' +
          '<thead><tr>' +
            '<th>' + t('ugColName') + '</th>' +
            '<th>' + t('ugColDesc') + '</th>' +
            '<th>' + t('ugColMembers') + '</th>' +
            '<th>' + t('ugColRoles') + '</th>' +
            '<th>' + t('ugColResGroups') + '</th>' +
            '<th>' + t('almColOp') + '</th>' +
          '</tr></thead>' +
          '<tbody>' + (rows.length ? rows.map(userGroupRowHTML).join('') :
            '<tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:38px 0;">' +
            t('ugEmpty') + '</td></tr>') +
          '</tbody>' +
        '</table></div>' +
        '<div class="table-foot">' +
          '<span>' + tf('ugFoot', { n: rows.length }) + '</span>' +
          '<span class="filter-spacer"></span>' +
          '<span>' + t('ugFootHint') + '</span>' +
        '</div>' +
      '</div>';

    $('btnUgCreate').addEventListener('click', function () { openDrawer('ugcreate', null); });
    $('ugq').addEventListener('input', function () {
      ugFilter.q = this.value;
      var tbody = content.querySelector('table.data tbody');
      var list = filteredUserGroups();
      tbody.innerHTML = list.length ? list.map(userGroupRowHTML).join('') :
        '<tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:38px 0;">' +
        t('ugEmpty') + '</td></tr>';
      content.querySelector('.table-foot span').textContent = tf('ugFoot', { n: list.length });
      bindUserGroupRows();
    });
    $('ugFilterReset').addEventListener('click', function () {
      ugFilter = { q: '' };
      renderUserGroupPage();
    });
    bindUserGroupRows();
  }

  function bindUserGroupRows() {
    content.querySelectorAll('[data-ug-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var gid = b.closest('tr').getAttribute('data-ug');
        var act = b.getAttribute('data-ug-act');
        if (act === 'edit') openGroupEditDrawer('ug', gid);
        else if (act === 'members') openMembersDrawer(gid);
        else if (act === 'perm') openPermDrawer(gid);
        else if (act === 'delete') openDeleteUserGroupModal(gid);
      });
    });
  }

  /* ---------- 成员管理 ---------- */
  /* 修改名称与用途说明；内置组不允许改名（名称字段只读） */
  function openGroupEditDrawer(kind, id) {
    var g = kind === 'ug' ? groupOf(id) : rgById(id);
    if (!g) return;
    var seed = { grpBuiltin: !!g.builtin };
    if (kind === 'ug') {
      seed.ugId = id;
      openDrawer('ugedit', null, seed);
    } else {
      seed.rgId = id;
      openDrawer('rgedit', null, seed);
    }
  }

  function openMembersDrawer(gid) {
    openDrawer('ugmembers', null, { ugId: gid });
  }
  function memberRowHTML(a, gid) {
    return '<tr data-member="' + esc(a.name) + '">' +
      '<td class="col-name"><span class="cell-name"><b>' + esc(a.name) + '</b>' +
        (a.builtin ? '<span class="badge badge-builtin">' + t('badgeBuiltin') + '</span>' : '') +
      '</span></td>' +
      '<td><span class="badge badge-plain">' +
        (a.auth === 'local' ? t('authLocal') : t('authSSO')) + '</span></td>' +
      '<td><span class="badge ' + (a.status === 'active' ? 'badge-active' : 'badge-locked') + '">' +
        (a.status === 'active' ? t('stActive') : t('stLocked')) + '</span></td>' +
      '<td class="col-act"><div class="row-actions">' +
        '<button type="button" class="link-btn is-danger" data-member-del="' + esc(a.name) + '">' +
          t('btnRemove') + '</button>' +
      '</div></td>' +
    '</tr>';
  }
  function membersTableHTML(gid) {
    var list = membersOfGroup(gid);
    if (!list.length) return '<div class="scope-empty">' + t('membersEmpty') + '</div>';
    return '<table class="mini-table"><thead><tr>' +
      '<th>' + t('colAccount') + '</th><th>' + t('accAuthType') + '</th>' +
      '<th>' + t('accStatus') + '</th><th></th></tr></thead><tbody>' +
      list.map(function (a) { return memberRowHTML(a, gid); }).join('') +
    '</tbody></table>';
  }
  /* 候选账户：本组之外的账户；已归属其他组的标注「将迁入本组」 */
  function memberCandidates(gid) {
    return ACCOUNTS.filter(function (a) { return a.group !== gid; })
      .map(function (a) { return { key: a.name, a: a }; });
  }
  function openMemberPickModal(gid) {
    var items = memberCandidates(gid);
    if (!items.length) { toast(t('membersEmpty'), 'info'); return; }
    var html = '<table class="mini-table"><thead><tr>' +
      '<th class="col-check"></th><th>' + t('colAccount') + '</th>' +
      '<th>' + t('colAccountGroup') + '</th><th>' + t('accStatus') + '</th></tr></thead><tbody>' +
      items.map(function (it) {
        var g = groupOf(it.a.group);
        return '<tr><td class="col-check"><input type="checkbox" class="pick-row" data-key="' +
          esc(it.key) + '" /></td>' +
          '<td>' + esc(it.a.name) + '</td>' +

  function openDeleteUserGroupModal(gid) {
    var g = groupOf(gid);
    if (!g || g.builtin) return;          // 内置用户组不允许删除

    var members = membersOfGroup(gid);
    var roles = joinNames(roleNamesOfGroup(gid));
    var rgs = joinNames(resGroupNamesOfUserGroup(gid));
    var impacts = [];
    impacts.push(members.length ? tf('delUgImpMembers', { n: members.length }) : t('delUgImpNone'));
    if (roles) impacts.push(tf('delUgImpRoles', { names: esc(roles) }));
    if (rgs) impacts.push(tf('delUgImpRes', { names: esc(rgs) }));
    openConfirmModal({
      title: t('delUgTitle'),
      bodyHTML: '<p>' + tf('delUgBody', { name: esc(groupName(gid)) }) + '</p>' +
                '<ul>' + impacts.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>',
      confirmText: t('delUgConfirm'),
      danger: true,
      onConfirm: function () {
        // 成员归属解除（不删除账户）、角色绑定与资源组关联一并解除
        members.forEach(function (a) { a.group = ''; });
        delete GROUP_ROLES[gid];
        RESOURCE_GROUPS.forEach(function (rg) {
          var i = rg.grants.indexOf(gid);
          if (i !== -1) rg.grants.splice(i, 1);
        });
        GROUPS.splice(GROUPS.indexOf(g), 1);
        renderUserGroupPage();
        toast(tf('toastUgDeleted', { name: groupName(gid) }), 'ok');
      }
    });
  }

    return d ? (state.lang === 'zh-CN' ? d.nm.zh : d.nm.en) : code;
  }
  function statDef(code) { return STAT_ALARM_DEFS[code]; }

  /* 按所选时间范围聚合各告警的发生次数 */
  function statRows() {
    var map = {};
    ALARM_EVENTS.forEach(function (e) {
      if (statFilter.from && e.d < statFilter.from) return;
      if (statFilter.to && e.d > statFilter.to) return;
      var def = statDef(e.code);
      if (!def) return;
      if (!map[e.code]) {
        map[e.code] = { code: e.code, lv: def.lv, obj: def.obj, part: def.part, n: 0 };
      }
      map[e.code].n += e.n;
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) {
        if (b.n !== a.n) return b.n - a.n;                // 数量倒序
        return a.code < b.code ? -1 : 1;                  // 数量相同按告警ID升序
      });
  }
  function filteredStatRows() {
    var q = statFilter.q.trim().toLowerCase();
    return statRows().filter(function (r) {
      if (q && statDefName(r.code).toLowerCase().indexOf(q) === -1 &&
          r.code.toLowerCase().indexOf(q) === -1) return false;
      if (statFilter.level && r.lv !== statFilter.level) return false;
      if (statFilter.part && r.part !== statFilter.part) return false;
      if (statFilter.obj && r.obj !== statFilter.obj) return false;
      return true;
    });
  }
  function statTotal(rows) {
    return rows.reduce(function (s, r) { return s + r.n; }, 0);
  }
  function statObjOptions() {
    return Object.keys(STAT_ALARM_DEFS).map(function (k) { return STAT_ALARM_DEFS[k].obj; })
      .filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
  }

        '<span class="rank-bar"><i class="is-' + r.lv + '" style="width:' +
          Math.round(r.n / max * 100) + '%"></i></span>' +
        '<span class="rank-count">' + r.n + '</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  function bindAlarmConfigPage() {
    $('btnRuleCreate').addEventListener('click', function () { openRuleDrawer(null); });
    $('btnRuleEnable').addEventListener('click', function () { openRuleStateModal(true); });
    $('btnRuleDisable').addEventListener('click', function () { openRuleStateModal(false); });
    $('btnRuleBatchDelete').addEventListener('click', function () { openRuleDeleteModal(); });

    $('ruleCheckAll').addEventListener('change', function () {
      var on = $('ruleCheckAll').checked;
      BLOCK_RULES.forEach(function (r) {
        if (on) ruleSelected[r.id] = true; else delete ruleSelected[r.id];
      });
      renderAlarmConfigPage();
    });

    content.querySelectorAll('.row-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-rule');
        if (cb.checked) ruleSelected[id] = true; else delete ruleSelected[id];
        syncRuleSelectionUI();
      });
    });

    content.querySelectorAll('[data-rule-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = ruleById(b.closest('tr').getAttribute('data-rule'));
        if (!r) return;
        var act = b.getAttribute('data-rule-act');
        if (act === 'edit') openRuleDrawer(r);
        else if (act === 'toggle') openRuleStateModal(!r.enabled, [r.id]);
        else if (act === 'delete') openRuleDeleteModal([r.id]);
      });
    });
    syncRuleSelectionUI();
  }

  function syncRuleSelectionUI() {
    var n = selectedRuleIds().length;
    ['btnRuleEnable', 'btnRuleDisable', 'btnRuleBatchDelete'].forEach(function (id) {
      var b = $(id);
      if (b) b.disabled = n === 0;
    });
    var all = $('ruleCheckAll');
    if (all) {
      all.checked = BLOCK_RULES.length > 0 && n === BLOCK_RULES.length;
      all.indeterminate = n > 0 && n < BLOCK_RULES.length;
    }
    var foot = content.querySelector('.table-foot span');
    if (foot) {
      foot.textContent = tf('ruleFoot', { n: BLOCK_RULES.length }) +
        (n ? ' · ' + tf('accFootSelected', { n: n }) : '');
    }
  }

    openConfirmModal({
      title: t(on ? 'ruleBatchEnable' : 'ruleBatchDisable'),

      onConfirm: function () { toggleRules(ids, on); }

  function openRuleDeleteModal(only) {
    var ids = only || selectedRuleIds();
    if (!ids.length) return;
    var list = ids.map(ruleById).filter(Boolean);
    openConfirmModal({
      title: t('ruleBatchDelete'),
      bodyHTML: '<p>' + t('ruleConfirmDelete') + '</p>' + ruleMiniTable(list),
      confirmText: t('ruleDelete'),
      danger: true,
      wide: true,
      onConfirm: function () {
        ids.slice().forEach(function (id) {
          var r = ruleById(id);

  /* 候选告警源（来源 IP + 部件类型 + 告警对象 去重） */
  function sourceCandidates() {
    var seen = {}, out = [];
    CURRENT_ALARMS.concat(HISTORY_ALARMS).forEach(function (a) {
      var k = a.ip + '|' + a.part + '|' + a.obj;
      if (seen[k]) return;
      seen[k] = 1;
      out.push({ key: k, ip: a.ip, part: a.part, obj: a.obj });
    });
    return out;
  }

  /* 「添加」弹窗：勾选候选条目后加入抽屉里的范围列表 */
  function openScopePickModal(kind) {
    var r = drawerState.rule;
    var isSrc = kind === 'src';
    var items = isSrc ? sourceCandidates() : alarmCandidates();
    if (!items.length) { toast(t('ruleEmpty'), 'info'); return; }
    var html = '<table class="mini-table"><thead><tr>' +
      '<th class="col-check"></th>' +
      (isSrc
        ? '<th>' + t('blkSource') + '</th><th>' + t('almColPart') + '</th><th>' + t('almColObj') + '</th>'
        : '<th>' + t('blkSource') + '</th><th>' + t('almColId') + '</th><th>' + t('almFieldName') + '</th>') +
      '</tr></thead><tbody>' +
      items.map(function (it) {
        return '<tr><td class="col-check"><input type="checkbox" class="pick-row" data-key="' +
          esc(it.key) + '" /></td>' +
          '<td class="des-mono">' + esc(it.ip) + '</td>' +
          (isSrc
            ? '<td>' + esc(partName(it.part)) + '</td><td>' + esc(it.obj) + '</td>'
            : '<td class="des-mono">' + esc(it.code) + '</td><td>' + esc(it.name) + '</td>') +
          '</tr>';
      }).join('') + '</tbody></table>';
    openConfirmModal({
      title: t(isSrc ? 'addSrcTitle' : 'addAlmTitle'),
      bodyHTML: html,
      confirmText: t('addOk'),
      danger: false,
      wide: true,
      guard: function () {
        if (!pickedScopeKeys().length) { toast(t('errPickNone'), 'info'); return false; }
        return true;
      },
      onConfirm: function () {
        var keys = pickedScopeKeys();
        keys.forEach(function (k) {
          var it = items.filter(function (x) { return x.key === k; })[0];
          if (!it) return;
          if (isSrc) {
            if (!r.sources.some(function (s) { return sourceKey(s) === k; })) {
              r.sources.push({ ip: it.ip, part: it.part, obj: it.obj });
            }
          } else if (!r.alarms.some(function (e) { return e.id === it.a.id; })) {
            r.alarms.push({ id: it.a.id, ip: it.ip, code: it.code, nm: it.a.nm });
          }
        });
        renderDrawer();
        toast(tf('toastRuleAdded', { n: keys.length }), 'ok');
      }
    });
  }
  function pickedScopeKeys() {
    return Array.prototype.slice.call($('modalBody').querySelectorAll('.pick-row'))

      .map(function (c) { return c.getAttribute('data-key'); });

    });

  function fField(id, labelKey, opts) {
    opts = opts || {};
    var required = opts.required ? '<span class="req">*</span>' : '';
    var inner;
    if (opts.type === 'select') {
      inner = '<select class="f-input" id="' + id + '">' + opts.options + '</select>';
    } else if (opts.type === 'textarea') {
      inner = '<textarea class="f-input f-textarea" id="' + id + '" placeholder="' +
              esc(opts.ph || '') + '">' + esc(opts.value || '') + '</textarea>';
    } else if (opts.type === 'time') {
      inner = '<input class="f-input" id="' + id + '" type="time" value="' +
              esc(opts.value || '') + '" />';
    } else if (opts.type === 'password') {
      inner = '<div class="f-row">' +
        '<input class="f-input" id="' + id + '" type="password" autocomplete="new-password" ' +
               'placeholder="' + esc(opts.ph || '') + '" />' +
        '<button type="button" class="f-eye" data-eye="' + id + '" aria-label="' + t('showPwd') + '">' +
          icon('eye') + '</button></div>';
    } else {
      inner = '<input class="f-input" id="' + id + '" type="text" ' +
              (opts.readonly ? 'readonly ' : '') +
              'placeholder="' + esc(opts.ph || '') + '" value="' + esc(opts.value || '') + '" />';
    }
    return '<div class="f-field" data-field="' + id + '">' +
      '<label class="f-label" for="' + id + '">' + t(labelKey) + required + '</label>' +
      inner +
      (opts.hint ? '<p class="f-hint">' + t(opts.hint) + '</p>' : '') +
      '<p class="f-error"></p>' +
    '</div>';
  }

          esc(state.lang === 'zh-CN' ? g.zh : g.en) + '</option>';
