  function renderDrawer() {
    var cfg = DRAWER_CFG[drawerState.mode];
    if (!cfg) return;
    $('drawerTitle').textContent = t(drawerState.titleKey || cfg.title);
    var sub = $('drawerSub');
    if (cfg.sub) { sub.hidden = false; sub.textContent = t(cfg.sub); } else { sub.hidden = true; }
    $('drawerNote').textContent = cfg.note ? t(cfg.note) : '';
    $('drawer').classList.toggle('is-wide', !!cfg.wide);
    $('drawerCancel').textContent = t('btnCancel');
    $('drawerCancel').hidden = !!cfg.readonly;      // 只读抽屉（证书详情）只有一个「关闭」
    $('drawerSubmit').textContent = t(cfg.submit);
    $('drawerBody').innerHTML = drawerBodyHTML();
    bindDrawer();

    /* 抽屉底部的第三个按钮（当前仅 SFTP 的「测试连接」用） */
    var extra = $('drawerExtra');
    if (cfg.extra) {
      extra.hidden = false;
      extra.textContent = t(cfg.extra);
    } else {
      extra.hidden = true;
    }

    if (drawerState.mode === 'import') {
      syncDropzoneActions();
    } else if (drawerState.mode === 'sftpedit') {
      refreshSftpGate();                    // 测试连通性通过后才允许保存（FR-3RD-002）
    } else {
      $('drawerSubmit').disabled = false;   // 清掉导入模式残留的禁用态
    }

    var first = $('drawerBody').querySelector('.f-input:not([readonly])');
    if (first) first.focus();
  }

  /* 导入抽屉：提交按钮在未选文件时禁用 */
  function syncDropzoneActions() {
    $('drawerSubmit').disabled = !drawerState.file;
  }

  function bindDrawer() {
    $('drawerBody').querySelectorAll('[data-eye]').forEach(function (b) {
      b.addEventListener('click', function () {
        var input = $(b.getAttribute('data-eye'));
        var toText = input.type === 'password';
        input.type = toText ? 'text' : 'password';
        b.innerHTML = icon(toText ? 'eyeOff' : 'eye');
        b.setAttribute('aria-label', t(toText ? 'hidePwd' : 'showPwd'));
      });
    });
    $('drawerBody').querySelectorAll('.f-input').forEach(function (el) {
      // data-clear 用于把输入框归到某个 data-field（例如起止日期 / 起止时间共用一个错误位）
      var key = el.getAttribute('data-clear') || el.id;
      el.addEventListener('input', function () { clearFieldError(key); });
      el.addEventListener('change', function () { clearFieldError(key); });
    });

    if (drawerState.mode === 'rtlog') {
      var seg = $('rtSeg');
      if (seg) {
        seg.querySelectorAll('.seg-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            if ($('rtHours')) drawerState.rtHours = $('rtHours').value;
            if ($('rtFrom')) drawerState.rtFrom = $('rtFrom').value;
            if ($('rtTo')) drawerState.rtTo = $('rtTo').value;
            drawerState.rtMode = b.getAttribute('data-mode');
            renderDrawer();
          });
        });
      }
      return;
    }

    if (drawerState.mode === 'certedit') {
      var wsw = $('certWarnSw');
      if (wsw) {
        wsw.addEventListener('click', function () {
          var on = !wsw.classList.contains('is-on');
          wsw.classList.toggle('is-on', on);
          wsw.setAttribute('aria-checked', String(on));
          wsw.querySelector('.switch-label').textContent =
            t(on ? 'certWarnEnabled' : 'certWarnDisabled');
          var daysField = $('drawerBody').querySelector('[data-field="certWarnDays"]');
          daysField.classList.toggle('is-disabled', !on);
          $('certWarnDays').disabled = !on;
          clearFieldError('certWarnDays');
        });
      }
      return;
    }

    if (drawerState.mode === 'csr') {
      var asw = $('csrAdv');
      if (asw) {
        asw.addEventListener('click', function () {
          var on = !asw.classList.contains('is-on');
          asw.classList.toggle('is-on', on);
          asw.setAttribute('aria-checked', String(on));
          asw.querySelector('.switch-label').textContent = t(on ? 'swOn' : 'swOff');
          $('csrAdvBox').hidden = !on;      // 关闭高级时隐藏额外的可配信息
          drawerState.csrAdv = on;
        });
      }
      return;
    }

    if (drawerState.mode === 'ugmembers') {
      if ($('btnAddMember')) $('btnAddMember').addEventListener('click', function () {
        openMemberPickModal(drawerState.ugId);
      });
      $('drawerBody').querySelectorAll('[data-member-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          var name = b.getAttribute('data-member-del');
          var a = findAccount(name);
          if (!a) return;
          a.group = '';                     // 移出用户组：该账户随即失去经该组获得的权限
          renderDrawer();
          toast(tf('toastMemberRemoved', { name: name }), 'ok');
        });
      });
      return;
    }
    if (drawerState.mode === 'ugperm') {
      if ($('btnBindRole')) $('btnBindRole').addEventListener('click', function () {
        openRoleBindModal(drawerState.ugId);
      });
      if ($('btnLinkRes')) $('btnLinkRes').addEventListener('click', function () {
        openResLinkModal(drawerState.ugId);
      });
      $('drawerBody').querySelectorAll('[data-unbind-role]').forEach(function (b) {
        b.addEventListener('click', function () {
          var rid = b.getAttribute('data-unbind-role');
          var gid = drawerState.ugId;
          if ((groupOf(gid) || {}).builtin) return;   // 内置用户组：不允许移除绑定角色（OI-M04-007）
          GROUP_ROLES[gid] = (GROUP_ROLES[gid] || [])
            .filter(function (r) { return r.id !== rid; });
          renderDrawer();
          toast(t('toastRoleUnbound'), 'ok');
        });
      });
      $('drawerBody').querySelectorAll('[data-unlink-rg]').forEach(function (b) {
        b.addEventListener('click', function () {
          var rg = rgById(b.getAttribute('data-unlink-rg'));
          var gid = drawerState.ugId;
          if (rg) {
            var i = rg.grants.indexOf(gid);
            if (i !== -1) rg.grants.splice(i, 1);
          }
          renderDrawer();
          toast(t('toastResUnlinked'), 'ok');
        });
      });
      return;
    }
    if (drawerState.mode === 'rggrant') {
      if ($('btnGrantUg')) $('btnGrantUg').addEventListener('click', function () {
        openGrantPickModal(drawerState.rgId);
      });
      $('drawerBody').querySelectorAll('[data-grant-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          var rg = rgById(drawerState.rgId);
          var gid = b.getAttribute('data-grant-del');
          if (rg) {
            var i = rg.grants.indexOf(gid);
            if (i !== -1) rg.grants.splice(i, 1);
          }
          renderDrawer();
          toast(tf('toastGrantRemoved', { name: groupName(gid) }), 'ok');
        });
      });
      return;
    }

    if (drawerState.mode === 'ruleedit') {
      var rsw = $('ruleEnabled');
      if (rsw) {
        rsw.addEventListener('click', function () {
          var on = !rsw.classList.contains('is-on');
          rsw.classList.toggle('is-on', on);
          rsw.setAttribute('aria-checked', String(on));
          rsw.querySelector('.switch-label').textContent = t(on ? 'swOn' : 'swOff');
          drawerState.rule.enabled = on;
        });
      }
      var bindRuleSeg = function (id, attr, key) {
        var box = $(id);
        if (!box) return;
        box.querySelectorAll('.seg-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            syncRuleDraft();                       // 切分段控件会重绘，先回存已填内容
            drawerState.rule[key] = b.getAttribute(attr);
            renderDrawer();
          });
        });
      };
      bindRuleSeg('ruleDateSeg', 'data-dmode', 'dateMode');
      bindRuleSeg('ruleTimeSeg', 'data-tmode', 'timeMode');
      bindRuleSeg('ruleSrcSeg', 'data-smode', 'srcMode');
      bindRuleSeg('ruleNmSeg', 'data-nmode', 'nameMode');

      if ($('ruleAddSrc')) $('ruleAddSrc').addEventListener('click', function () {
        syncRuleDraft();
        openScopePickModal('src');
      });
      if ($('ruleAddAlm')) $('ruleAddAlm').addEventListener('click', function () {
        syncRuleDraft();
        openScopePickModal('alm');
      });
      $('drawerBody').querySelectorAll('[data-scope-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          syncRuleDraft();
          var i = Number(b.getAttribute('data-i'));
          if (b.getAttribute('data-scope-del') === 'src') drawerState.rule.sources.splice(i, 1);
          else drawerState.rule.alarms.splice(i, 1);
          renderDrawer();
        });
      });
      return;
    }

    if (drawerState.mode === 'alarmblock') {
      $('drawerBody').querySelectorAll('.radio-input').forEach(function (r) {
        r.addEventListener('change', function () {
          $('drawerBody').querySelectorAll('.radio-item').forEach(function (l) {
            l.classList.toggle('is-on', l.querySelector('.radio-input').checked);
          });
          drawerState.blkScope = r.value;
        });
      });
      var dseg = $('blkDateSeg');
      if (dseg) {
        dseg.querySelectorAll('.seg-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            // 切换「永久 / 指定日期」需要重绘日期输入，先回存已填内容
            drawerState.blkName = val('blkName');
            drawerState.blkDesc = val('blkDesc');
            drawerState.blkFrom = val('blkFrom');
            drawerState.blkTo = val('blkTo');
            drawerState.blkDateMode = b.getAttribute('data-dmode');
            renderDrawer();
          });
        });
      }
      var tseg = $('blkTimeSeg');
      if (tseg) {
        tseg.querySelectorAll('.seg-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            drawerState.blkName = val('blkName');
            drawerState.blkDesc = val('blkDesc');
            drawerState.blkStart = val('blkStart');
            drawerState.blkEnd = val('blkEnd');
            drawerState.blkTimeMode = b.getAttribute('data-tmode');
            renderDrawer();
          });
        });
      }
      return;
    }

    if (drawerState.mode === 'bakplan') {
      var bsw = $('bakPlanSw');
      if (bsw) {
        bsw.addEventListener('click', function () {
          var on = !bsw.classList.contains('is-on');
          bsw.classList.toggle('is-on', on);
          bsw.setAttribute('aria-checked', String(on));
          bsw.querySelector('.switch-label').textContent = t(on ? 'swOn' : 'swOff');
          $('bakPlanBox').hidden = !on;      // 关闭计划开关时隐藏下方全部配置
          drawerState.bakOn = on;
        });
      }
      var bseg = $('bakFreqSeg');
      if (bseg) {
        bseg.querySelectorAll('.seg-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            // 切频率需要重绘（仅每周才有星期多选框），先把已填内容回存
            drawerState.bakFreq = b.getAttribute('data-freq');
            drawerState.bakTime = val('bakTime');
            drawerState.bakCopies = val('bakCopies');
            var picked = pickedWeekdays();
            if (picked) drawerState.bakWeekdays = picked;
            renderDrawer();
          });
        });
      }
      $('drawerBody').querySelectorAll('.wd-check').forEach(function (cb) {
        cb.addEventListener('change', function () {
          cb.closest('.wd-item').classList.toggle('is-on', cb.checked);
          clearFieldError('bakWeekdays');
        });
      });
      return;
    }

    /* ---------- 第三方接入（M14）：SNMP 通道 / SFTP 连接 ---------- */
    if (drawerState.mode === 'snmpedit') {
      var vsel = $('snmpVersion');
      if (vsel) {
        vsel.addEventListener('change', function () {
          syncSnmpDraft();                  // 切换版本要重绘（仅 v3 有认证与加密配置）
          drawerState.snmp.version = vsel.value;
          renderDrawer();
        });
      }
      var vsw = $('snmpVerifySw');
      if (vsw) {
        vsw.addEventListener('click', function () {
          var on = !vsw.classList.contains('is-on');
          vsw.classList.toggle('is-on', on);
          vsw.setAttribute('aria-checked', String(on));
          vsw.querySelector('.switch-label').textContent = t(on ? 'swOn' : 'swOff');
          drawerState.snmp.verify = on;
        });
      }
      var psw = $('snmpPwdCheckSw');
      if (psw) {
        psw.addEventListener('click', function () {
          var on = !psw.classList.contains('is-on');
          psw.classList.toggle('is-on', on);
          psw.setAttribute('aria-checked', String(on));
          psw.querySelector('.switch-label').textContent = t(on ? 'swOn' : 'swOff');
          drawerState.snmp.pwdCheck = on;
        });
      }
      $('drawerBody').querySelectorAll('[data-report]').forEach(function (cb) {
        cb.addEventListener('change', function () {
          cb.closest('.radio-item').classList.toggle('is-on', cb.checked);
        });
      });
      return;
    }
    if (drawerState.mode === 'sftpedit') {
      /* 任一字段改动后都需重新测试：清掉测试结果，并按测试状态控制保存按钮 */
      $('drawerBody').querySelectorAll('.f-input').forEach(function (el) {
        el.addEventListener('input', function () {
          if (drawerState.sftpTested || drawerState.sftpTestError) {
            drawerState.sftpTested = false;
            drawerState.sftpTestError = '';
            refreshSftpGate();
          }
        });
      });
      return;
    }

    if (drawerState.mode === 'certimport' || drawerState.mode === 'caedit') {
      $('drawerBody').querySelectorAll('[data-pick]').forEach(function (btn) {
        var kind = btn.getAttribute('data-pick');
        var input = $('file-' + kind);
        btn.addEventListener('click', function () { input.click(); });
        input.addEventListener('change', function () {
          if (!this.files || !this.files[0]) return;
          var f = this.files[0];
          drawerState.certFiles[kind] = { name: f.name, size: fmtBytes(f.size) };
          var span = document.querySelector('[data-upname="' + kind + '"]');
          span.textContent = f.name + ' · ' + fmtBytes(f.size);
          span.classList.add('is-set');
          clearFieldError('up-' + kind);
        });
      });
      if (drawerState.mode === 'certimport') return;   // caedit 无其他绑定，继续往下走会直接返回
    }

    if (drawerState.mode !== 'import') return;

    var dz = $('dropzone'), fi = $('fileInput');
    dz.addEventListener('click', function () { fi.click(); });
    dz.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); }
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) {
        e.preventDefault(); dz.classList.add('is-over');
      });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) {
        e.preventDefault(); dz.classList.remove('is-over');
      });
    });
    dz.addEventListener('drop', function (e) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) setPickedFile(f.name, f.size);
    });
    fi.addEventListener('change', function () {
      if (this.files && this.files[0]) setPickedFile(this.files[0].name, this.files[0].size);
    });
    var tpl = $('tplDownload');
    if (tpl) tpl.addEventListener('click', function () {
      toast(t('toastTpl'), 'info');
    });
  }

  function fmtBytes(bytes) {
    return bytes >= 1048576
      ? (bytes / 1048576).toFixed(1) + ' MB'
      : Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }

  function setPickedFile(name, bytes) {
    drawerState.file = { name: name, size: fmtBytes(bytes) };
    renderDrawer();
  }

  function clearFieldError(id) {
    if (!drawerState.errors[id]) return;
    delete drawerState.errors[id];
    var f = $('drawerBody').querySelector('[data-field="' + id + '"]');
    if (f) { f.classList.remove('has-error'); f.querySelector('.f-error').textContent = ''; }
  }

  function showErrors() {
    Object.keys(drawerState.errors).forEach(function (id) {
      var f = $('drawerBody').querySelector('[data-field="' + id + '"]');
      if (!f) return;
      f.classList.add('has-error');
      f.querySelector('.f-error').textContent = t(drawerState.errors[id]);
    });
    var firstBad = $('drawerBody').querySelector('.f-field.has-error .f-input');
    if (firstBad) firstBad.focus();
  }

  function val(id) { var el = $(id); return el ? el.value.trim() : ''; }
  function passwordOk(p) {
    if (p.length < 8) return false;
    var n = 0;
    if (/[A-Z]/.test(p)) n++;
    if (/[a-z]/.test(p)) n++;
    if (/[0-9]/.test(p)) n++;
    if (/[^A-Za-z0-9]/.test(p)) n++;
    return n >= 3;
  }

  function validateDrawer() {
    var e = {};
    var m = drawerState.mode;

    if (m === 'create') {
      var name = val('fName');
      if (!name) e.fName = 'errRequired';
      else if (!/^[A-Za-z0-9._-]{3,32}$/.test(name)) e.fName = 'errName';
      else if (findAccount(name)) e.fName = 'errNameDup';
    }
    if (m === 'rtlog') {
      if ((drawerState.rtMode || 'preset') === 'preset') {
        var hv = val('rtHours');
        var hn = Number(hv);
        if (hv === '' || isNaN(hn)) e.rtHours = 'errRequired';
        else if (hn < 2 || hn > 48) e.rtHours = 'errHours';
      } else {
        var fv = val('rtFrom'), tv = val('rtTo');
        if (!fv) e.rtFrom = 'errTimeRequired';
        if (!tv) e.rtTo = 'errTimeRequired';
        if (fv && tv && fv >= tv) e.rtTo = 'errTimeOrder';
      }
    }
    if (m === 'selfpwd' && !val('fOldPwd')) e.fOldPwd = 'errOldPwd';
    if (m === 'create' || m === 'reset' || m === 'selfpwd') {
      var p1 = val('fPwd'), p2 = val('fPwd2');
      if (!p1) e.fPwd = 'errRequired';
      else if (!passwordOk(p1)) e.fPwd = 'errPwdPolicy';
      if (!p2) e.fPwd2 = 'errRequired';
      else if (p2 !== p1) e.fPwd2 = 'errPwdMismatch';
    }
    if (m === 'create' || m === 'edit') {
      var mail = val('fEmail');
      if (!mail) e.fEmail = 'errRequired';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) e.fEmail = 'errEmail';
      if (!val('fGroup')) e.fGroup = 'errRequired';
    }
    if (m === 'import') {
      if (!drawerState.file) { toast(t('errNoFile'), 'info'); return false; }
    }
    if (m === 'certedit') {
      // 过期预警关闭时不校验天数（输入框已置灰）
      if ($('certWarnSw').classList.contains('is-on')) {
        var dv = val('certWarnDays'), dn = Number(dv);
        if (dv === '' || isNaN(dn)) e.certWarnDays = 'errRequired';
        else if (dn < 30 || dn > 90) e.certWarnDays = 'errWarnDays';
      }
    }
    if (m === 'csr') {
      // 高级开启时才校验主题信息，常用名（CN）为必填
      if (!$('csrAdvBox').hidden && !val('csrCN')) e.csrCN = 'errCsrCn';
    }
    if (m === 'ugcreate' || m === 'rgcreate' || m === 'ugedit' || m === 'rgedit') {
      var isU = (m === 'ugcreate' || m === 'ugedit');
      var selfId = m === 'ugedit' ? drawerState.ugId : (m === 'rgedit' ? drawerState.rgId : null);
      var pool = isU ? GROUPS : RESOURCE_GROUPS;
      var gname = val('grpName');
      if (!gname) e.grpName = 'errRequired';
      else if (pool.some(function (g) {
                 return g.id !== selfId && (g.zh === gname || g.en === gname);
               })) {
        e.grpName = 'errNameDupGroup';
      }
      if (!val('grpDesc')) e.grpDesc = 'errRequired';
    }
    if (m === 'ruleedit') {
      var dr = drawerState.rule || blankRule();
      if (!val('ruleName')) e.ruleName = 'errRequired';
      if (!val('ruleDesc')) e.ruleDesc = 'errRequired';
      if ((dr.dateMode || 'forever') === 'range') {
        var rf = val('ruleFrom'), rt = val('ruleTo');
        if (!rf || !rt) e.ruleDate = 'errBlkDateRange';
        else if (rf > rt) e.ruleDate = 'errBlkDateOrder';
      }
      if ((dr.timeMode || '24h') === 'range') {
        var rs = val('ruleStart'), re2 = val('ruleEnd');
        if (!rs || !re2) e.ruleTime = 'errBlkTimeRange';
        else if (rs >= re2) e.ruleTime = 'errBlkTimeOrder';
      }
      if (dr.srcMode === 'custom' && !dr.sources.length) e.ruleSrc = 'errScopeEmpty';
      if (dr.nameMode === 'custom' && !dr.alarms.length) e.ruleAlm = 'errScopeEmpty';
    }
    if (m === 'alarmblock') {
      if (!val('blkName')) e.blkName = 'errRequired';
      if (!val('blkDesc')) e.blkDesc = 'errRequired';
      if ((drawerState.blkDateMode || 'forever') === 'range') {
        var df = val('blkFrom'), dt2 = val('blkTo');
        if (!df || !dt2) e.blkDate = 'errBlkDateRange';
        else if (df > dt2) e.blkDate = 'errBlkDateOrder';
      }
      if ((drawerState.blkTimeMode || '24h') === 'range') {
        var ts = val('blkStart'), te = val('blkEnd');
        if (!ts || !te) e.blkTime = 'errBlkTimeRange';
        else if (ts >= te) e.blkTime = 'errBlkTimeOrder';
      }
    }
    if (m === 'bakplan' && $('bakPlanSw').classList.contains('is-on')) {
      // 计划开关关闭时下方配置整体隐藏，不参与校验
      if ((drawerState.bakFreq || BAK.freq) === 'weekly' && !pickedWeekdays().length) {
        e.bakWeekdays = 'errBakWeekday';
      }
      if (!val('bakTime')) e.bakTime = 'errBakTime';
      var kv = val('bakCopies'), kn = Number(kv);
      if (kv === '' || isNaN(kn) || kn < 1 || kn > 10) e.bakCopies = 'errBakCopies';
    }
    if (m === 'certimport') {
      // 证书与 CA证书必填；私钥与私钥密码在「导入系统CSR文件签发的证书」时可不配置
      if (!drawerState.certFiles.cert) e['up-cert'] = 'errCertFile';
      if (!drawerState.certFiles.ca) e['up-ca'] = 'errCaFile';
    }
    if (m === 'snmpedit') {
      var sn = drawerState.snmp;
      if (!val('snmpName')) e.snmpName = 'errRequired';
      var spv = val('snmpPort');
      if (!spv) e.snmpPort = 'errRequired';
      else if (!portOk(spv)) e.snmpPort = 'errSnmpPort';
      var sip = val('snmpIp');
      if (!sip) e.snmpIp = 'errRequired';
      else if (!ipOk(sip)) e.snmpIp = 'errIpFormat';
      if (sn.version === 'v3') {
        if (!val('snmpUser')) e.snmpUser = 'errRequired';
        var a1 = val('snmpAuthPwd'), a2 = val('snmpAuthPwd2');
        var p1 = val('snmpPrivPwd'), p2 = val('snmpPrivPwd2');
        if (!sn.id || a1) {                       // 修改时留空表示不修改凭据
          if (!a1) e.snmpAuthPwd = 'errRequired';
          else if (sn.pwdCheck && !passwordOk(a1)) e.snmpAuthPwd = 'errPwdPolicy';
          if (!a2) e.snmpAuthPwd2 = 'errRequired';
          else if (a2 !== a1) e.snmpAuthPwd2 = 'errPwdMismatch';
        }
        if (!sn.id || p1) {
          if (!p1) e.snmpPrivPwd = 'errRequired';
          else if (sn.pwdCheck && !passwordOk(p1)) e.snmpPrivPwd = 'errPwdPolicy';
          if (!p2) e.snmpPrivPwd2 = 'errRequired';
          else if (p2 !== p1) e.snmpPrivPwd2 = 'errPwdMismatch';
        }
      }
      if (!val('snmpDesc')) e.snmpDesc = 'errRequired';
    }
    if (m === 'sftpedit') {
      var sf = drawerState.sftp;
      if (!sf.host) e.sftpIp = 'errRequired';
      else if (!ipOk(sf.host)) e.sftpIp = 'errIpFormat';
      if (!sf.port) e.sftpPort = 'errRequired';
      else if (!portOk(sf.port)) e.sftpPort = 'errSnmpPort';
      if (!sf.user) e.sftpUser = 'errRequired';
      if (!sf.path) e.sftpPath = 'errRequired';
      if (!SFTP.configured && !sf.pwd) e.sftpPwd = 'errRequired';
      if (!drawerState.sftpTested) e.sftpTested = 'sftpNeedTest';
    }
    if (m === 'caedit') {
      var cv = val('caIp');
      if (!cv) e.caIp = 'errRequired';
      else if (!ipv4Ok(cv)) e.caIp = ipv6Ok(cv) ? 'errIpv4Only' : 'errIpFormat';
      var cpv = val('caPort');
      if (!cpv) e.caPort = 'errRequired';
      else if (!portOk(cpv)) e.caPort = 'errSnmpPort';
      var crv = val('caRenewDays'), crn = Number(crv);
      if (crv === '' || isNaN(crn) || String(crn) !== crv) e.caRenewDays = 'errCaRenewDays';
      else if (crn < 7 || crn > 180) e.caRenewDays = 'errCaRenewDays';
      if (!val('caPath')) e.caPath = 'errRequired';
      if (!drawerState.certFiles.cert) e['up-cert'] = 'errCertFile';
      if (!drawerState.certFiles.ca) e['up-ca'] = 'errCaFile';
      if (!drawerState.certFiles.key) e['up-key'] = 'errKeyFile';
      if (!CA.configured && !val('caKeyPwd')) e.caKeyPwd = 'errRequired';
    }
    drawerState.errors = e;
    if (Object.keys(e).length) { showErrors(); return false; }
    return true;
  }

  function submitDrawer() {
    var m = drawerState.mode, a = drawerState.account;

    /* 只读抽屉（证书详情 / 成员管理 / 权限配置 / 资源清单 / 授权情况）：
       底部主按钮就是「关闭」，不参与表单校验，点击即关闭抽屉 */
    if (DRAWER_CFG[m] && DRAWER_CFG[m].readonly) { closeDrawer(); return; }

    if (!validateDrawer()) return;

    /* ---------- 第三方接入（M14） ---------- */
    if (m === 'snmpedit') {
      syncSnmpDraft();
      var sd = drawerState.snmp;
      // 开启「连通性校验」时做一次模拟校验；不通过则不允许启用（保存后置为停用，FR-3RD-001）
      var bad = sd.verify && UNREACHABLE_HOSTS.indexOf(sd.ip) !== -1;
      var rec = sd.id ? snmpById(sd.id) : null;
      if (rec) {
        rec.name = sd.name; rec.version = sd.version; rec.verify = sd.verify;
        rec.port = sd.port; rec.ip = sd.ip; rec.user = sd.user;
        rec.authAlg = sd.version === 'v3' ? sd.authAlg : '';
        rec.privAlg = sd.version === 'v3' ? sd.privAlg : '';
        rec.pwdCheck = sd.pwdCheck; rec.lang = sd.lang; rec.report = sd.report.slice();
        rec.desc = sd.desc;
      } else {
        rec = {
          id: 'snmp-' + Date.now(), name: sd.name, version: sd.version, verify: sd.verify,
          port: sd.port, ip: sd.ip, user: sd.user,
          authAlg: sd.version === 'v3' ? sd.authAlg : '',
          privAlg: sd.version === 'v3' ? sd.privAlg : '',
          pwdCheck: sd.pwdCheck, lang: sd.lang, report: sd.report.slice(), desc: sd.desc,
          engineId: genEngineId(), enabled: true
        };
        SNMP_LIST.push(rec);
      }
      if (bad) rec.enabled = false;
      closeDrawer();
      renderIntegrationPage();
      toast(t(bad ? 'toastSnmpUnreachable' : (sd.id ? 'toastSnmpSaved' : 'toastSnmpCreated')),
            bad ? 'info' : 'ok');
      return;
    }
    if (m === 'sftpedit') {
      syncSftpDraft();
      var sfd = drawerState.sftp;
      var wasConfigured = SFTP.configured;
      SFTP.configured = true;
      SFTP.enabled = true;
      SFTP.host = sfd.host; SFTP.port = sfd.port; SFTP.user = sfd.user; SFTP.path = sfd.path;
      SFTP.testedAt = fmtDateTimeSec(new Date());
      syncProtoSftp();
      closeDrawer();
      renderIntegrationPage();

      draft.desc = val('ruleDesc');
      draft.from = val('ruleFrom');
      draft.to = val('ruleTo');
      draft.start = val('ruleStart');
      draft.end = val('ruleEnd');
      draft.at = fmtDateTimeSec(new Date());

      var blkScopeVal = drawerState.blkScope || 'ip';

      var blkNameVal = val('blkName'), blkDescVal = val('blkDesc');

      var blkFrom = val('blkFrom'), blkTo = val('blkTo');
      var blkTimeMode = drawerState.blkTimeMode || '24h';
      var blkStart = val('blkStart'), blkEnd = val('blkEnd');
      closeDrawer();
      var doCreateRule = function () {
        addRuleFromAlarm(blkAlarm, blkScopeVal, blkNameVal, blkDescVal,
                         blkDateMode, blkFrom, blkTo, blkTimeMode, blkStart, blkEnd);
        toast(t('toastBlkSaved'), 'ok');
      };
      if (blkScopeVal === 'ip') {
        // 屏蔽范围为「该来源的全部告警」时范围较大，保存前要求操作者确认（FR-ALM-003）
        openConfirmModal({
          title: t('blkConfirmTitle'),

      var planOn = $('bakPlanSw').classList.contains('is-on');

      closeDrawer();
      if (state.route === '#/settings/cert') renderCertPage();
      toast(t('toastCertImported'), 'ok');

    }

    if (m === 'create') {
      ACCOUNTS.push({

        status: 'locked',                       // 新建即锁定，须由安全管理员激活（FR-ACC-005）
        group: val('fGroup'), auth: 'local', email: val('fEmail'), online: false,
        remark: { zh: '', en: '' }              // 本地账号备注为空值
      });
      accFilter = { q: '', status: '', auth: '', group: '' };
      closeDrawer(); renderAccountPage(); toast(t('toastCreated'), 'ok');
      return;

      a.email = val('fEmail');

      return;

    if (m === 'reset') {
      closeDrawer(); toast(tf('toastReset', { name: a.name }), 'ok');
      return;
    }
    if (m === 'rtlog') {
      // 实际实现：创建日志收集任务并交由任务中心排队（FR-RTLOG-002 / FR-COM-002）
      var now = new Date(), fromStr, toStr;
      if ((drawerState.rtMode || 'preset') === 'preset') {
        // 指定时间：以当前时刻为终点，向前推 N 小时
        fromStr = fmtDateTime(new Date(now.getTime() - Number(val('rtHours')) * 3600 * 1000));
        toStr = fmtDateTime(now);
      } else {
        fromStr = val('rtFrom').replace('T', ' ');
        toStr = val('rtTo').replace('T', ' ');
      }
      RT_LOGS.unshift({
        file: 'modelengine-logs-' + fmtDateTime(now).replace(/[-: ]/g, '').slice(0, 12) + '.zip',
        from: fromStr, to: toStr, status: 'running', at: fmtDateTimeSec(now)
      });
      closeDrawer();
      if (state.route === '#/settings/runlog') renderRunlogPage();
      toast(t('toastRtCreated'), 'ok');
      return;
    }
    if (m === 'selfpwd') {
      // 实际实现：校验原密码 → 更新凭据 → 该账户其他在线会话失效（FR-ACC-006）
      closeDrawer(); toast(t('toastSelfPwd'), 'ok');
      return;
    }
    if (m === 'import') {
      var f = drawerState.file;
      closeDrawer(); toast(tf('toastImported', { name: f.name }), 'ok');
    }

  /* 通用确认弹窗：danger=true 为破坏性操作（红色警示图标 + 红色确认按钮） */
  var modalAction = null, modalGuard = null;
  function openConfirmModal(opts) {
    $('modalTitle').textContent = opts.title;
    $('modalBody').innerHTML = opts.bodyHTML;
    $('modalCancel').textContent = t('btnCancel');
    var c = $('modalConfirm');
    c.textContent = opts.confirmText;
    c.className = 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary');
    $('modalHead').classList.toggle('is-info', !opts.danger);
    // 破坏性操作 → 警示三角；告知性确认 → 信息圆
    $('modalIcon').innerHTML = opts.danger
      ? '<path d="M10.3 3.9 1.9 18.4A2 2 0 0 0 3.6 21.4h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>' +
        '<path d="M12 9v4.4"/><path d="M12 17h.01"/>'
      : '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.4"/><path d="M12 7.8h.01"/>';
    $('modalBox').classList.toggle('is-wide', !!opts.wide);
    modalAction = opts.onConfirm;
    modalGuard = opts.guard || null;      // 返回 false 时保持弹窗打开（例如未勾选任何条目）
    $('modalCancel').hidden = !!opts.hideCancel;   // 纯告知弹窗只保留一个按钮
    $('modalMask').hidden = false;
    c.focus();

  /* ===================== 首次登录用户协议（FR-AUTH-008） =====================
     规则：首次登录（改密后重新登录）进入首页时弹出；「确定」满 5 秒方可点击；
          确认后方可使用系统功能；点「取消」强制登出并返回登录页。
          未确认前协议窗口覆盖全部界面，且不可通过 Esc / 点击遮罩关闭。
  ================================================================= */
  var AGR_SECONDS = 5;
  var agrTimer = null;
  var agrLeft = 0;

  function renderAgreementBody() {
    $('agrBody').innerHTML = t('agrText').map(function (sec) {
      return '<h3>' + esc(sec.h) + '</h3>' +
             sec.p.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('');
    }).join('');
  }

  function paintAgreementText() {
    renderAgreementBody();
    var btn = $('agrConfirm');
    if (btn.disabled) {
      $('agrHint').innerHTML = tf('agrHintWait', { n: agrLeft });
      btn.textContent = tf('agrConfirmCount', { n: agrLeft });
    } else {
      $('agrHint').textContent = t('agrHintReady');
      btn.textContent = t('agrConfirm');
    }
  }

  function openAgreement() {
    $('agrMask').hidden = false;
    $('agrBody').scrollTop = 0;
    $('agrConfirm').disabled = true;
    agrLeft = AGR_SECONDS;
    paintAgreementText();
    $('agrBody').focus();
    if (agrTimer) window.clearInterval(agrTimer);
    agrTimer = window.setInterval(function () {
      agrLeft--;
      if (agrLeft <= 0) {
        window.clearInterval(agrTimer); agrTimer = null;
        $('agrConfirm').disabled = false;
      }
      paintAgreementText();
    }, 1000);
  }

  function closeAgreement() {
    if (agrTimer) { window.clearInterval(agrTimer); agrTimer = null; }
    $('agrMask').hidden = true;
  }

  function clearPendingAgreement() {
    try { sessionStorage.removeItem('oms.pendingAgreement'); } catch (e) {}
  }

  $('agrConfirm').addEventListener('click', function () {
    if (this.disabled) return;
    closeAgreement();
    // 实际实现：此处将「账户 + 协议版本 + 确认时间」提交后端留痕（FR-OPLOG-001）
    try { sessionStorage.setItem('oms.agreementConfirmed', '1'); } catch (e) {}
    clearPendingAgreement();
    toast(t('toastAgrOk'), 'ok');
  });

  $('agrCancel').addEventListener('click', function () {
    // 取消即强制登出：终止本地会话并返回登录页（FR-AUTH-008 / FR-AUTH-007）
    closeAgreement();
    clearPendingAgreement();
    try { sessionStorage.removeItem('oms.agreementConfirmed'); } catch (e) {}
    window.location.href = 'login.html';
  });

  /* ===================== 轻提示 ===================== */
  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast ' + (kind === 'ok' ? 'is-ok' : 'is-info');
    el.innerHTML = icon(kind === 'ok' ? 'check' : 'info') + '<span></span>';
    el.querySelector('span').textContent = msg;
    $('toastWrap').appendChild(el);
    window.setTimeout(function () { el.remove(); }, 2800);
  }

          '<span class="no-permission-icon">' + icon('lock') + '</span>' +

      state.lang = btn.getAttribute('data-lang');
      renderAll();
    });

  // 路由
  function applyRoute(hash) {
    var h = hash || '#/home';
    var known = h === '#/home' || h === '#/tasks' || h === '#/security' ||
                SETTINGS_CHILDREN.some(function (c) { return c.route === h; }) ||
                REGISTERED_MODULES.some(function (m) { return m.route === h; });
    state.route = known ? h : '#/home';
    if (state.route === h || !known) { /* noop */ }
    // 进入设置子页时自动展开分组
    if (SETTINGS_CHILDREN.some(function (c) { return c.route === state.route; })) {
      state.settingsOpen = true;
    }
    renderAll();
    closeNavDrawer();
    content.scrollTop = 0;
  }
  window.addEventListener('hashchange', function () { applyRoute(location.hash); });

  // 用户菜单
  function setMenuOpen(open) {
    state.menuOpen = open;
    userMenu.hidden = !open;
    userBtn.setAttribute('aria-expanded', String(open));
  }
  userBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    setMenuOpen(!state.menuOpen);
  });
  document.addEventListener('click', function () { if (state.menuOpen) setMenuOpen(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!$('agrMask').hidden) return;   // 协议未确认前不允许用 Esc 关闭
      if (!$('infoMask').hidden) { closeInfoModal(); return; }
      if (!$('modalMask').hidden) { closeModal(); return; }
      if (!drawer.hidden) { closeDrawer(); return; }
      setMenuOpen(false); closeNavDrawer();

  /* 抽屉与弹窗 */
  $('taskCenterBtn').addEventListener('click', function () { location.hash = '#/tasks'; });

  /* 用户菜单：基本信息 / 修改密码 / 退出登录 */
  $('profileBtn').addEventListener('click', function () { setMenuOpen(false); openInfoModal(); });
  $('selfPwdBtn').addEventListener('click', function () { setMenuOpen(false); openDrawer('selfpwd', null); });
  $('infoClose').addEventListener('click', closeInfoModal);
  $('infoMask').addEventListener('click', function (e) {
    if (e.target === $('infoMask')) closeInfoModal();
  });

  $('drawerClose').addEventListener('click', closeDrawer);
  $('drawerCancel').addEventListener('click', closeDrawer);
  $('drawerMask').addEventListener('click', closeDrawer);
  $('drawerSubmit').addEventListener('click', submitDrawer);
  /* 抽屉底部第三个按钮：目前只有 SFTP 的「测试连接」用到 */
  $('drawerExtra').addEventListener('click', function () {
    if (drawerState.mode === 'sftpedit') testSftpConn();
  });
  $('modalCancel').addEventListener('click', closeModal);
  $('modalMask').addEventListener('click', function (e) {
    if (e.target === $('modalMask')) closeModal();
  });
  $('modalConfirm').addEventListener('click', function () {
    if (modalAction && !pendingBatch && !pendingDelete) {
      if (modalGuard && modalGuard() === false) return;
      var fn = modalAction;
      closeModal();
      fn();
      return;
    }
    if (pendingBatch) {
      var n = pendingBatch.length;
      pendingBatch.slice().forEach(function (name) {
        var a = findAccount(name);
        if (a && !a.builtin) {
          ACCOUNTS.splice(ACCOUNTS.indexOf(a), 1);
          delete accSelected[name];
        }
      });
      dropSessionsOf(pendingBatch);      // 账户被删除后其在线会话一并终止（FR-ACC-004）
      pendingBatch = null;
      closeModal();
      renderAccountPage();
      toast(tf('toastBatchDeleted', { n: n }), 'ok');
      return;
    }
    if (!pendingDelete) return;
    var name = pendingDelete.name;
    ACCOUNTS.splice(ACCOUNTS.indexOf(pendingDelete), 1);
    dropSessionsOf([name]);              // 账户被删除后其在线会话一并终止（FR-ACC-004）
    closeModal();
    renderAccountPage();
    toast(tf('toastDeleted', { name: name }), 'ok');
  });
  // 退出登录：按 FR-AUTH-007 终止本地会话，返回登录页
  $('logoutBtn').addEventListener('click', function () {
    location.href = 'login.html';
  });

  // 窄屏抽屉
  function openNavDrawer() {
    layout.classList.add('nav-open');
    navOverlay.hidden = false;
  }
  function closeNavDrawer() {
    layout.classList.remove('nav-open');
    navOverlay.hidden = true;
  }
  navToggle.addEventListener('click', function () {
    layout.classList.contains('nav-open') ? closeNavDrawer() : openNavDrawer();
  });
  navOverlay.addEventListener('click', closeNavDrawer);

  // 原型控件
  $('protoToggle').addEventListener('click', function () {
    var open = $('protoPanel').hidden;
    $('protoPanel').hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  document.querySelectorAll('#permSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.perm = b.getAttribute('data-perm');
      document.querySelectorAll('#permSeg button').forEach(function (x) {
        x.classList.toggle('is-on', x === b);
      });
      // 权限收紧后若当前路由已不可见，回落到首页（或空态）
      var reachable = state.route === '#/home' ? allowed('home')
        : SETTINGS_CHILDREN.some(function (c) { return c.route === state.route && allowed(c.id); }) ||
          REGISTERED_MODULES.some(function (m) { return m.route === state.route; });
      if (!reachable) { location.hash = '#/home'; if (!location.hash) applyRoute('#/home'); }
      renderAll();
    });
  });
  $('protoAgreement').addEventListener('click', function () { openAgreement(); });

  document.querySelectorAll('#roleSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.role = b.getAttribute('data-role');
      document.querySelectorAll('#roleSeg button').forEach(function (x) {
        x.classList.toggle('is-on', x === b);
      });
      renderAll();
    });
  });
  $('protoModules').addEventListener('change', function () {
    state.showModules = this.checked;
    renderAll();
  });
  // 模拟第三方接入（M14）里是否已配置远程 SFTP：系统备份页的远程备份状态取自该配置
  $('protoSftp').addEventListener('change', function () {
    SFTP.configured = this.checked;
    renderAll();
  });

  /* ===================== 初始化 ===================== */
  applyRoute(location.hash || '#/home');

  /* 首次登录（改密后重新登录）进入系统时，若用户协议尚未确认则在首页弹出（FR-AUTH-008） */
  try {
    if (sessionStorage.getItem('oms.pendingAgreement') === '1') openAgreement();
  } catch (e) { /* 忽略隐私模式限制 */ }
})();
</script>
</body>
</html>
